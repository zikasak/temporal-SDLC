services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal-schema:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PASSWORD: temporal
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal create
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal setup-schema -v 0.0
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal_visibility create
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal_visibility setup-schema -v 0.0
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

  temporal:
    image: temporalio/server:1.32.2
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /tmp/temporal-dynamic.yaml
    configs:
      - source: temporal_dynamic
        target: /tmp/temporal-dynamic.yaml
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 30

  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        temporal operator namespace describe --address temporal:7233 --namespace default >/dev/null 2>&1 ||
        temporal operator namespace create --address temporal:7233 --namespace default --retention 1d
        # Executions record the repository and branch they work for, and task flows their origin
        # (GET /workflows); the main worker registers the other attributes it uses.
        for name in Repository Branch OnboardingId TaskOrigin; do
          temporal operator search-attribute list --address temporal:7233 --namespace default | grep -qw "$$name" ||
          temporal operator search-attribute create --address temporal:7233 --namespace default --name "$$name" --type Keyword
        done
    restart: on-failure:5

  temporal-ui:
    image: temporalio/ui:2.58.1
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

volumes:
  postgres_data:

configs:
  temporal_dynamic:
    content: |
      {}
