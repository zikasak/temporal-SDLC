[pytest]
# --strict-config: an outdated pytest-asyncio ignores asyncio_default_test_loop_scope,
# runs each test on its own loop and leaves the session's Temporal clients on another,
# so every workflow call hangs until its RPC timeout. Fail at startup instead.
# -n auto: run on every core (pytest-xdist); pass -n0 to debug a single test.
# --dist worksteal: a worker that runs out of tests takes those still queued on another.
# xdist's default hands each worker its share up front, so the last worker would run a
# file of slow tests alone while the others sit idle.
addopts = --strict-config -n auto --dist worksteal
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
