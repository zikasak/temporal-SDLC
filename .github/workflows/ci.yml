name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # Pi serves the pi and openai adapters; tests drive it against stand-in endpoints,
      # traced by its Langfuse plugin. The versions the application images install.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global @earendil-works/pi-coding-agent@1.6.0 @langfuse/pi-observability-plugin@0.1.2
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Component tests
        working-directory: component-tests
        # Unlike the backend's pytest.ini, this suite's starts no parallel workers.
        run: PYTHONPATH=../backend python -m pytest -q -n auto --dist worksteal
      - name: Component contract matches the code
        # The mypy version of the platform's conformance check (app.languages.python.components.MYPY).
        run: |
          pip install mypy==1.18.2
          bash backend/tools/check_component_contract.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/app/languages/typescript/static_check/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Static check
        # The ESLint configuration the delivery review runs over TypeScript parts.
        run: |
          npm ci --prefix backend/app/languages/typescript/static_check --no-audit --no-fund
          (cd backend/app/languages/typescript/static_check && node --test)
          backend/app/languages/typescript/static_check/node_modules/.bin/eslint \
            --config backend/app/languages/typescript/static_check/eslint.config.mjs frontend
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
