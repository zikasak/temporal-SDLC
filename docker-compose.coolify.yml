# Coolify deployment (Docker Compose build pack, base directory /). Assign the public
# domain to `frontend` (port 80); nothing else needs one. `temporal-ui` has no
# authentication: give it a domain only behind access control.
#
# The host's Docker socket is not mounted anywhere. `sandbox-worker`, which runs the coding
# and verification stages, drives `sandbox`, a separate Docker daemon whose socket lives in a volume only they mount. The
# daemon does not listen on TCP, so the containers it runs cannot reach its API. The
# server needs the Sysbox runtime (https://github.com/nestybox/sysbox) installed.
#
# Sign-in is required. Coolify generates the token-signing secret. Open the site right
# after the first deployment to register the first user, who registers the others; until
# then anyone who reaches it can. Passwords are reset from the `api` container's terminal:
# python -m app.auth.users add you@example.com
#
# Set in Coolify: the credentials and service URL for the adapters selected in Settings,
# GITHUB_TOKEN_ENCRYPTION_KEY and GITHUB_ALLOWED_ORIGINS (the public origin, such as
# https://app.example.com). Pi uses OPENAI_API_KEY for openai/* models and
# ANTHROPIC_API_KEY for anthropic/* models. For openai-codex/*, sign in with Pi in
# the API container as user app (UID 10001); its dedicated credential volume is
# shared with workers and the sandbox daemon so OAuth refreshes persist. The API refreshes
# the OAuth tokens ahead of expiry, so agent containers, which can be killed, never do.
# Provider and Langfuse URLs must be reachable from the sandbox, so not localhost.

x-app: &app
  build: ./backend
  restart: unless-stopped
  environment: &app-environment
    APP_DATABASE_URL: postgresql://temporal:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/temporal
    TEMPORAL_ADDRESS: temporal:7233
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    PI_CREDENTIALS_DIR: /pi/agent
    # Also used by the interactive Pi login in the API container's terminal.
    PI_CODING_AGENT_DIR: /pi/agent
    PI_CREDENTIALS_SHARED: "true"
    AGENT_CONTEXT_TOKENS: ${AGENT_CONTEXT_TOKENS:-64000}
    CONTRACT_EMBED_CHARS: ${CONTRACT_EMBED_CHARS:-32000}
    # Per-stage agent tool-turn budgets, forwarded into agent containers; blank keeps
    # each stage's built-in default (implementation 200, others 80).
    IMPLEMENTATION_MAX_TURNS: ${IMPLEMENTATION_MAX_TURNS:-}
    TEST_GENERATION_MAX_TURNS: ${TEST_GENERATION_MAX_TURNS:-}
    REVIEW_MAX_TURNS: ${REVIEW_MAX_TURNS:-}
    DIAGNOSIS_MAX_TURNS: ${DIAGNOSIS_MAX_TURNS:-}
    DOCUMENTATION_MAX_TURNS: ${DOCUMENTATION_MAX_TURNS:-}
    ROUTING_MAX_TURNS: ${ROUTING_MAX_TURNS:-}
    # Deterministic checks in place of parts of the code review; each off unless "true".
    REVIEW_SKIP_SETTLED: ${REVIEW_SKIP_SETTLED:-false}
    REVIEW_REQUIREMENT_TAGS: ${REVIEW_REQUIREMENT_TAGS:-false}
    REVIEW_SEAM_CHECKS: ${REVIEW_SEAM_CHECKS:-false}
    REVIEW_STATIC_CHECKS: ${REVIEW_STATIC_CHECKS:-false}
    GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
    GITHUB_ALLOWED_ORIGINS: ${GITHUB_ALLOWED_ORIGINS:-}
    # Optional, such as https://app.example.com/api/connectors/github/events; derived
    # from the request through the frontend's proxy otherwise.
    GITHUB_WEBHOOK_URL: ${GITHUB_WEBHOOK_URL:-}
    # How often a waiting delivery checks whether its pull request was merged or closed.
    PULL_REQUEST_CHECK_INTERVAL_SECONDS: ${PULL_REQUEST_CHECK_INTERVAL_SECONDS:-3600}
    AUTH_JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
    AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-12}
    AUTH_LOGIN_ATTEMPTS_PER_MINUTE: ${AUTH_LOGIN_ATTEMPTS_PER_MINUTE:-10}
    # Coolify's proxy and the frontend's nginx. Add one per further proxy or CDN in front.
    AUTH_TRUSTED_PROXY_HOPS: ${AUTH_TRUSTED_PROXY_HOPS:-2}
    LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-false}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-production}
    APP_TRACE_CONTENT_ENABLED: ${APP_TRACE_CONTENT_ENABLED:-false}
  volumes:
    - app_data:/data
    - pi_credentials:/pi/agent
  depends_on: &app-depends-on
    pi-credentials-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    temporal-namespace:
      condition: service_completed_successfully

# The worker that builds and runs containers: images pass between stages as local image
# IDs, so every sandboxed stage uses this one daemon.
x-sandbox-worker: &sandbox-worker
  <<: *app
  environment:
    <<: *app-environment
    DOCKER_HOST: unix:///run/sandbox/docker.sock
  volumes:
    - app_data:/data
    - pi_credentials:/pi/agent
    - sandbox_socket:/run/sandbox:ro
  depends_on:
    <<: *app-depends-on
    sandbox:
      condition: service_healthy

services:
  pi-credentials-init:
    build: ./backend
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -R 10001:10001 /pi/agent
        chmod 700 /pi/agent
    volumes:
      - pi_credentials:/pi/agent

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

  api:
    <<: *app
    expose:
      - "8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.temporal.worker"]

  codegen-worker:
    <<: *app
    command: ["python", "-m", "app.codegen.worker"]

  # Implementation, test generation, verification, diagnosis, review and documentation.
  sandbox-worker:
    <<: *sandbox-worker
    command: ["python", "-m", "app.agent_workflows.worker"]

  sandbox:
    image: docker:29-dind
    restart: unless-stopped
    # Sysbox (installed on the host) runs Docker-in-Docker without `privileged`: root in
    # this container is an unprivileged user on the host.
    runtime: sysbox-runc
    depends_on:
      pi-credentials-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # Agent, build and generated-service containers get the internet but no private
        # address: not the other services, the host or a cloud metadata endpoint. Remove
        # a range here if the LLM provider lives in it. dockerd keeps this chain.
        iptables -N DOCKER-USER 2>/dev/null || iptables -F DOCKER-USER
        iptables -A DOCKER-USER -o docker0 -j RETURN
        iptables -A DOCKER-USER -o br-+ -j RETURN
        iptables -A DOCKER-USER -d 10.0.0.0/8 -j REJECT
        iptables -A DOCKER-USER -d 172.16.0.0/12 -j REJECT
        iptables -A DOCKER-USER -d 192.168.0.0/16 -j REJECT
        iptables -A DOCKER-USER -d 169.254.0.0/16 -j REJECT
        # Naming dockerd explicitly skips the image's default TCP listener. The socket's
        # group is the application image's user.
        exec dockerd-entrypoint.sh dockerd --host=unix:///run/sandbox/docker.sock --group=10001
    volumes:
      - sandbox_socket:/run/sandbox
      - sandbox_data:/var/lib/docker
      # Agent bind sources are resolved inside this daemon, not the worker.
      - pi_credentials:/pi/agent
    # Its own network, apart from PostgreSQL and Temporal.
    networks:
      - sandbox
    healthcheck:
      test: ["CMD", "docker", "--host", "unix:///run/sandbox/docker.sock", "info"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal-schema:
    image: temporalio/admin-tools:1.32.2
    exclude_from_hc: true
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal create
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal setup-schema -v 0.0
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal_visibility create
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal_visibility setup-schema -v 0.0
        temporal-sql-tool --plugin postgres12 --ep postgres -u temporal -p 5432 --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

  temporal:
    image: temporalio/server:1.32.2
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${SERVICE_PASSWORD_POSTGRES}
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /tmp/temporal-dynamic.yaml
    # The server requires a dynamic config file and the image ships none.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        echo '{}' > /tmp/temporal-dynamic.yaml
        exec /etc/temporal/entrypoint.sh
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 30

  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    exclude_from_hc: true
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        temporal operator namespace describe --address temporal:7233 --namespace default >/dev/null 2>&1 ||
        temporal operator namespace create --address temporal:7233 --namespace default --retention 1d
        # Executions record the repository and branch they work for, and task flows their origin
        # (GET /workflows); the main worker registers the other attributes it uses.
        for name in Repository Branch OnboardingId TaskOrigin; do
          temporal operator search-attribute list --address temporal:7233 --namespace default | grep -qw "$$name" ||
          temporal operator search-attribute create --address temporal:7233 --namespace default --name "$$name" --type Keyword
        done
    restart: on-failure:5

  temporal-ui:
    image: temporalio/ui:2.58.1
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    expose:
      - "8080"

volumes:
  app_data:
  pi_credentials:
  postgres_data:
  sandbox_socket:
  sandbox_data:

networks:
  sandbox:
