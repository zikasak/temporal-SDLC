openapi: 3.1.0
info:
  description: "Turns tasks described in conversation into requirements, API designs\
    \ and verified code published to GitHub."
  title: Temporal project API
  version: 1.0.0
servers:
- url: /
security:
- bearer: []
paths:
  /api-design/sessions:
    post:
      description: Continues a completed requirements session of a new service or
        an API change.
      operationId: postApiDesignSessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartApiDesignSession"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
      summary: Start an API design session
      tags:
      - api-design
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}:
    get:
      description: "The session's conversation, state and delivery progress."
      operationId: getApiDesignSessionsBySessionId
      parameters:
      - description: api-design-session- followed by 32 hex digits.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiDesignSession"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
      summary: Get a API design session
      tags:
      - api-design
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}/answers:
    post:
      description: Answers the questions of the last assistant message and starts
        a turn.
      operationId: postApiDesignSessionsBySessionIdAnswers
      parameters:
      - description: api-design-session- followed by 32 hex digits.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswersInput"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatusChange"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
      summary: Answer the interviewer's questions
      tags:
      - api-design
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}/delivery/answers:
    post:
      description: Resumes the paused coding agent of the named stage workflow.
      operationId: postApiDesignSessionsBySessionIdDeliveryAnswers
      parameters:
      - description: api-design-session- followed by 32 hex digits.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAnswersInput"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
      summary: Answer a delivery agent's questions
      tags:
      - api-design
      x-requirements:
      - FR-14
  /api-design/sessions/{session_id}/delivery/findings/accept:
    post:
      description: "Clears the open-findings flag, keeps the pushed delivery as it\
        \ is and records findings_acceptance (when and by whom) in the delivery progress.\
        \ The publication stays marked as unverified. 409 while no flag is raised."
      operationId: postApiDesignSessionsBySessionIdDeliveryFindingsAccept
      parameters:
      - description: api-design-session- followed by 32 hex digits.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatusChange"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      summary: Accept the delivery with open review findings
      tags:
      - api-design
      x-requirements:
      - FR-30
  /api-design/sessions/{session_id}/delivery/findings/instructions:
    post:
      description: "Starts a fix round from the instructions, then verification and\
        \ code review, pushing the result to the same branch. The instructions are\
        \ recorded on the review round they start. If verification fails for good,\
        \ verification_status becomes error, the branch keeps the earlier unverified\
        \ push and the flag stays raised. 409 while no flag is raised."
      operationId: postApiDesignSessionsBySessionIdDeliveryFindingsInstructions
      parameters:
      - description: api-design-session- followed by 32 hex digits.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingsInstructionsInput"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatusChange"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Request Entity Too Large
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      summary: Give instructions about open review findings
      tags:
      - api-design
      x-requirements:
      - FR-30
      - FR-31
  /api-design/sessions/{session_id}/document:
    get:
      description: The OpenAPI document as a file attachment; 404 until it is ready.
      operationId: getApiDesignSessionsBySessionIdDocument
      parameters:
      - description: api-design-session- followed by 32 hex digits.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
      summary: Download the OpenAPI document
      tags:
      - api-design
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}/finalize:
    post:
      description: Writes the OpenAPI document; the session is completed once it is
        ready.
      operationId: postApiDesignSessionsBySessionIdFinalize
      parameters:
      - description: api-design-session- followed by 32 hex digits.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatusChange"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
      summary: Finalize the API design session
      tags:
      - api-design
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}/fork:
    post:
      description: Starts a new session with the conversation up to the given message.
      operationId: postApiDesignSessionsBySessionIdFork
      parameters:
      - description: api-design-session- followed by 32 hex digits.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
      summary: Fork the session
      tags:
      - api-design
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}/generation/retry:
    post:
      description: Starts the named stage of the delivery over. The review stage runs
        a failed code review again; 409 when the delivery has no failed review.
      operationId: postApiDesignSessionsBySessionIdGenerationRetry
      parameters:
      - description: api-design-session- followed by 32 hex digits.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryStageInput"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatusChange"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
      summary: Retry a delivery stage
      tags:
      - api-design
      x-requirements:
      - FR-14
      - FR-20
      - FR-26
  /api-design/sessions/{session_id}/messages:
    post:
      description: Starts the interviewer's turn on the message.
      operationId: postApiDesignSessionsBySessionIdMessages
      parameters:
      - description: api-design-session- followed by 32 hex digits.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatusChange"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Request Entity Too Large
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      summary: Send a message
      tags:
      - api-design
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}/retry:
    post:
      description: Runs the failed interviewer turn again.
      operationId: postApiDesignSessionsBySessionIdRetry
      parameters:
      - description: api-design-session- followed by 32 hex digits.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatusChange"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
      summary: Retry the last turn
      tags:
      - api-design
      x-requirements:
      - FR-13
  /auth/login:
    post:
      description: No sign-in required. Returns a session and sets the access_token
        cookie.
      operationId: postAuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      summary: Sign in
      tags:
      - auth
      x-requirements:
      - FR-2
      - NFR-1
      - NFR-3
  /auth/logout:
    post:
      description: No sign-in required. Clears the session cookie.
      operationId: postAuthLogout
      responses:
        "204":
          description: No Content
      summary: Sign out
      tags:
      - auth
      x-requirements:
      - FR-5
  /auth/me:
    get:
      description: The signed-in user.
      operationId: getAuthMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      summary: Current user
      tags:
      - auth
      x-requirements:
      - FR-3
      - FR-4
  /auth/register:
    post:
      description: No sign-in required. Registers and signs in the first account;
        403 once any account exists.
      operationId: postAuthRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: Created
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      summary: Register the first account
      tags:
      - auth
      x-requirements:
      - FR-1
      - FR-7
      - NFR-1
  /auth/registration:
    get:
      description: No sign-in required. Whether the first account can still be registered.
      operationId: getAuthRegistration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      summary: Registration status
      tags:
      - auth
      x-requirements:
      - FR-1
  /auth/users:
    get:
      description: Administrator only.
      operationId: getAuthUsers
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Account"
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
      summary: List accounts
      tags:
      - auth
      x-requirements:
      - FR-6
    post:
      description: Administrator only.
      operationId: postAuthUsers
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
      summary: Create an account
      tags:
      - auth
      x-requirements:
      - FR-6
      - FR-7
  /connectors/github/connection:
    delete:
      description: Removes the shared connection. The body is an empty JSON object.
      operationId: deleteConnectorsGithubConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
      summary: Disconnect GitHub
      tags:
      - github
      x-requirements:
      - FR-8
    get:
      description: "The shared connection, without its private key."
      operationId: getConnectorsGithubConnection
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      summary: GitHub connection status
      tags:
      - github
      x-requirements:
      - FR-8
      - NFR-2
    put:
      description: "Saves the app after GitHub confirms its key and installation.\
        \ The request must be application/json and come from an allowed origin, if\
        \ any."
      operationId: putConnectorsGithubConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubAppCredentials"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "403":
          content:
            application/json:
