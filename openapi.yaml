components:
  schemas:
    Credentials:
      description: A login and a password.
      example:
        password: password
        login: login
      properties:
        login:
          description: "An email address or a username, case-insensitive."
          title: login
          type: string
        password:
          title: password
          type: string
      required:
      - login
      - password
      title: Credentials
    Session:
      description: A signed-in session.
      example:
        access_token: access_token
        expires_at: 2000-01-23T04:56:07.000+00:00
        admin: true
        token_type: bearer
        login: login
      properties:
        access_token:
          description: "Bearer token, also set as the access_token cookie."
          title: access_token
          type: string
        token_type:
          enum:
          - bearer
          title: token_type
          type: string
        login:
          title: login
          type: string
        expires_at:
          format: date-time
          title: expires_at
          type: string
        admin:
          description: Whether the user is the first user.
          title: admin
          type: boolean
      required:
      - access_token
      - admin
      - expires_at
      - login
      - token_type
      title: Session
    Profile:
      description: The signed-in user.
      example:
        expires_at: 2000-01-23T04:56:07.000+00:00
        admin: true
        login: login
      properties:
        login:
          title: login
          type: string
        expires_at:
          format: date-time
          title: expires_at
          type: string
        admin:
          title: admin
          type: boolean
      required:
      - admin
      - expires_at
      - login
      title: Profile
    RegistrationStatus:
      description: Whether the first account can still be registered.
      example:
        open: true
      properties:
        open:
          title: open
          type: boolean
      required:
      - open
      title: RegistrationStatus
    Account:
      description: A user account.
      example:
        created_at: 2000-01-23T04:56:07.000+00:00
        login: login
      properties:
        login:
          title: login
          type: string
        created_at:
          format: date-time
          title: created_at
          type: string
      required:
      - created_at
      - login
      title: Account
    GitHubAppCredentials:
      description: A GitHub App to connect.
      example:
        private_key: private_key
        app_id: 0
        account: account
      properties:
        app_id:
          title: app_id
          type: integer
        private_key:
          description: The app's private key in PEM format.
          title: private_key
          type: string
        account:
          description: "The account the app is installed on, when it is installed\
            \ on several."
          title: account
          type: string
      required:
      - app_id
      - private_key
      title: GitHubAppCredentials
    ManifestCode:
      description: The code GitHub returned after creating an app from a manifest.
      example:
        code: code
      properties:
        code:
          title: code
          type: string
      required:
      - code
      title: ManifestCode
    EmptyObject:
      description: An empty JSON object.
      properties: {}
      type: object
    GitHubApp:
      description: A GitHub App.
      properties:
        id:
          title: id
          type: integer
        slug:
          title: slug
          type: string
      required:
      - id
      - slug
      title: GitHubApp
