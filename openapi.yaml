      description: Where the GitHub App is installed.
      properties:
        id:
          title: id
          type: integer
        account:
          title: account
          type: string
      required:
      - account
      - id
      title: GitHubInstallation
    GitHubConnection:
      description: The shared GitHub connection; never its private key.
