      description: replace starts drafting the full contract at the start, or returns
        to the interview with the drafts kept after a checkout update, and the onboarding
        then replaces every artifact listed in existing_artifacts (contract, contract
        tests, root Dockerfile). decline always ends the onboarding as declined, also
        after a checkout update, which ends its interview and drafts too, and leaves
        the existing files unchanged. architecture_only drafts only contracts/architecture.md
        and contracts/architecture.json from the existing code for review in the interview
        (replacing whichever of the two exists) and leaves every other existing file
        unchanged; the rest of the existing contract (requirements.json, requirements.md,
        api.json, openapi.yaml, language.json) must be readable, otherwise 409 with
        a detail naming the unreadable file, and while the onboarding runs, anything
        in the drafted architecture that disagrees with api.json or requirements.json
        is listed in problems, which must be settled in the interview before finalizing.
        409 when architecture_missing is false. 409 unless the onboarding is awaiting_confirmation.
