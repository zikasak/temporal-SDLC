openapi: 3.1.0
info:
  title: Temporal project API
  version: 1.0.0
  description: Turns tasks described in conversation into requirements, API designs
    and verified code published to GitHub.
paths:
  /api-design/sessions/{session_id}:
    get:
      operationId: getApiDesignSessionsBySessionId
      summary: Get a API design session
      description: The session's conversation, state and delivery progress, with lookup_requirements
        for explaining requirement IDs.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDesignSession'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-34
      - FR-35
      - FR-36
      - FR-37
      - FR-38
      - FR-39
      - FR-52
      - FR-54
      - FR-55
      - FR-83
      - FR-85
      - FR-118
      - FR-119
      - FR-120
      - FR-123
  /api-design/sessions/{session_id}/answers:
    post:
      operationId: postApiDesignSessionsBySessionIdAnswers
      summary: Answer the interviewer's questions
      description: Answers the questions of the last assistant message and starts
        a turn.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswersInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-design/sessions/{session_id}/delivery/answers:
    post:
      operationId: postApiDesignSessionsBySessionIdDeliveryAnswers
      summary: Answer a delivery agent's questions
      description: Resumes the paused coding agent of the named stage workflow.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentAnswersInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-14
  /api-design/sessions/{session_id}/delivery/findings/accept:
    post:
      operationId: postApiDesignSessionsBySessionIdDeliveryFindingsAccept
      summary: Accept the delivery with open review findings
      description: Clears the open-findings flag, keeps the pushed delivery as it
        is and records findings_acceptance (when and by whom) in the delivery progress.
        The publication stays marked as unverified. 409 while no flag is raised.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-30
  /api-design/sessions/{session_id}/delivery/findings/instructions:
    post:
      operationId: postApiDesignSessionsBySessionIdDeliveryFindingsInstructions
      summary: Give instructions about open review findings
      description: Starts a fix round from the instructions, then verification and
        code review, pushing the result to the same branch. The instructions are recorded
        on the review round they start. If verification fails for good, verification_status
        becomes error, the branch keeps the earlier unverified push and the flag stays
        raised. 409 while no flag is raised.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingsInstructionsInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-30
  /api-design/sessions/{session_id}/document:
    get:
      operationId: getApiDesignSessionsBySessionIdDocument
      summary: Download the OpenAPI document
      description: The OpenAPI document as a file attachment; 404 until it is ready.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-design/sessions/{session_id}/finalize:
    post:
      operationId: postApiDesignSessionsBySessionIdFinalize
      summary: Finalize the API design session
      description: Writes the OpenAPI document; the session is completed once it is
        ready.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-design/sessions/{session_id}/fork:
    post:
      operationId: postApiDesignSessionsBySessionIdFork
      summary: Fork the session
      description: Starts a new session with the conversation up to the given message.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-design/sessions/{session_id}/generation/retry:
    post:
      operationId: postApiDesignSessionsBySessionIdGenerationRetry
      summary: Retry a delivery stage
      description: Starts the named stage of the delivery over. The review stage runs
        a failed code review again; 409 when the delivery has no failed review. The
        repository stage pushes again and then opens or updates the pull request,
        which also recovers a pull request step that ended in error; it has the LLM
        write the pull request's title and description again, and is also allowed
        when only pull_request_text_error is set (the generic text was used). 409
        for the repository stage when there is no publication error, pull request
        error or pull request text error.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryStageInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-14
      - FR-20
      - FR-34
      - FR-36
      - FR-37
      - FR-52
      - FR-54
  /api-design/sessions/{session_id}/messages:
    post:
      operationId: postApiDesignSessionsBySessionIdMessages
      summary: Send a message
      description: Starts the interviewer's turn on the message.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-design/sessions/{session_id}/retry:
    post:
      operationId: postApiDesignSessionsBySessionIdRetry
      summary: Retry the last turn
      description: Runs the failed interviewer turn again.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /architecture/sessions/{session_id}:
    get:
      operationId: getArchitectureSessionsBySessionId
      summary: Get an architecture session
      description: 'The session''s draft, conversation, skip proposal and state, with
        lookup_requirements for explaining requirement IDs. Architecture sessions
        are started only by their requirements session (there is no POST /architecture/sessions)
        and have no idle timeout: they wait for the user indefinitely.'
      tags:
      - architecture
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: architecture-session- followed by 32 hex digits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureSession'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-78
      - FR-79
      - FR-80
      - FR-81
      - FR-84
      - FR-86
      - FR-118
      - FR-119
      - FR-120
  /architecture/sessions/{session_id}/answers:
    post:
      operationId: postArchitectureSessionsBySessionIdAnswers
      summary: Answer the interviewer's questions
      description: Answers the questions of the last assistant message and starts
        a turn.
      tags:
      - architecture
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: architecture-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswersInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-79
      - FR-86
  /architecture/sessions/{session_id}/document:
    get:
      operationId: getArchitectureSessionsBySessionIdDocument
      summary: Download the architecture document
      description: 'The architecture document as a file attachment: format md (the
        default) returns architecture.md with its fixed headings, format json returns
        its machine-readable form, architecture.json, as written to contracts/architecture.json.
        404 until it is ready or when the stage was skipped; 422 for any other format.'
      tags:
      - architecture
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: architecture-session- followed by 32 hex digits.
      - name: format
        in: query
        required: false
        schema:
          type: string
        description: md (default) for architecture.md or json for architecture.json;
          422 otherwise.
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-84
      - FR-86
  /architecture/sessions/{session_id}/finalize:
    post:
      operationId: postArchitectureSessionsBySessionIdFinalize
      summary: Finalize the architecture session
      description: Writes the architecture document; once it is ready the session
        is completed and starts the task's API design (api_design_session_id), which
        drafts the API at once using the finalized architecture. 409 while problems
        remain, a turn is running or the session is finalized or skipped.
      tags:
      - architecture
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: architecture-session- followed by 32 hex digits.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-82
      - FR-83
      - FR-84
      - FR-85
      - FR-86
  /architecture/sessions/{session_id}/fork:
    post:
      operationId: postArchitectureSessionsBySessionIdFork
      summary: Fork the session
      description: 'Starts a new architecture session of the same requirements session
        with the conversation up to the given message. The original stays open: each
        fork, when finalized or its skip confirmed, starts its own API design, a child
        of the requirements session like the others. 409 once the session''s API design
        has started.'
      tags:
      - architecture
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: architecture-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-86
      - FR-88
  /architecture/sessions/{session_id}/messages:
    post:
      operationId: postArchitectureSessionsBySessionIdMessages
      summary: Send a message
      description: 'Starts the interviewer''s turn on the message. Sending a message
        while a skip proposal is open declines it: the proposal is dismissed, skip_declined
        becomes true, the message explains what the architecture should cover and
        the LLM drafts the architecture from it without proposing a skip again.'
      tags:
      - architecture
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: architecture-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-79
      - FR-86
      - FR-97
  /architecture/sessions/{session_id}/retry:
    post:
      operationId: postArchitectureSessionsBySessionIdRetry
      summary: Retry the last turn
      description: Runs the failed drafting or interviewer turn again.
      tags:
      - architecture
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: architecture-session- followed by 32 hex digits.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
