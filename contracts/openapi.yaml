  /connectors/github/events:
    post:
      operationId: postConnectorsGithubEvents
      summary: Receive a GitHub webhook delivery
      description: 'No sign-in required; called by GitHub. Accepted only when X-Hub-Signature-256
        matches the connection''s webhook secret, computed over the raw body. A comment
        mentions the app when it contains @<app slug> or @<app slug>[bot], case-insensitive,
        as a whole word. Answers 202 with no body when the delivery was accepted and
        is acted on: a newly created comment (action created) mentioning the app in
        an issue_comment or pull_request_review_comment event on an open pull request
        the app opened for a delivery or an onboarding, by an author with write access,
        which is then classified and handled; mentions on an onboarding''s pull request
        are handled exactly like those on a delivery''s and shown in the onboarding''s
        delivery progress. A clarification is answered right away from the code as
        last pushed, even while a fix round of the delivery is running or queued.
        Answers 204 with no body when a correctly signed delivery is ignored: other
        events, edited or deleted comments, mentions on a closed or merged pull request,
        and mentions that are not authorised or not on the app''s pull requests. Ignored
        mentions are only logged on the server and not shown in any delivery. Fix
        requests already queued when the pull request is closed or merged still run.
        Answers 401 without acting on it when the delivery is unsigned or wrongly
        signed, or while the connection has no webhook secret. Answers 409 when the
        delivery (the same X-GitHub-Delivery) or its comment was already handled,
        such as a GitHub redelivery.'
      tags:
      - github
      parameters:
      - name: X-Hub-Signature-256
        in: header
        required: false
        schema:
          type: string
        description: sha256= followed by the HMAC-SHA256 of the body with the webhook
          secret, in hex.
      - name: X-GitHub-Event
        in: header
        required: false
        schema:
          type: string
        description: The event type, such as issue_comment or pull_request_review_comment.
      - name: X-GitHub-Delivery
        in: header
        required: false
        schema:
          type: string
        description: GitHub's ID of the delivery; a delivery ID already handled answers
          409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubWebhookEvent'
      responses:
        '202':
          description: Accepted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
