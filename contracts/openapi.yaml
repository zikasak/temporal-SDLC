openapi: 3.1.0
info:
  title: Temporal project API
  version: 1.0.0
  description: Turns tasks described in conversation into requirements, API designs
    and verified code published to GitHub.
paths:
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Sign in
      description: No sign-in required. Returns a session and sets the access_token
        cookie.
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-2
      - NFR-1
      - NFR-3
  /auth/registration:
    get:
      operationId: getAuthRegistration
      summary: Registration status
      description: No sign-in required. Whether the first account can still be registered.
      tags:
      - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatus'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-1
  /auth/register:
    post:
      operationId: postAuthRegister
      summary: Register the first account
      description: No sign-in required. Registers and signs in the first account;
        403 once any account exists.
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-1
      - FR-7
      - NFR-1
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Sign out
      description: No sign-in required. Clears the session cookie.
      tags:
      - auth
      responses:
        '204':
          description: No Content
      x-requirements:
      - FR-5
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Current user
      description: The signed-in user.
      tags:
      - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-3
      - FR-4
  /auth/users:
    get:
      operationId: getAuthUsers
      summary: List accounts
      description: Administrator only.
      tags:
      - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-6
    post:
      operationId: postAuthUsers
      summary: Create an account
      description: Administrator only.
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-6
      - FR-7
  /start:
    post:
      operationId: postStart
      summary: Start the sample workflow
      description: Runs the sample greeting workflow and returns its result.
      tags:
      - workflows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-18
  /workflows:
    get:
      operationId: getWorkflows
      summary: List workflow executions
      description: Newest first, 50 per page.
      tags:
      - workflows
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: A workflow type to list only.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
        description: next_page_token of the last page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-17
  /connectors/github/connection:
    get:
      operationId: getConnectorsGithubConnection
      summary: GitHub connection status
      description: The shared connection, without its private key.
      tags:
      - github
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubConnection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-8
      - NFR-2
    put:
      operationId: putConnectorsGithubConnection
      summary: Connect a GitHub App
      description: Saves the app after GitHub confirms its key and installation. The
        request must be application/json and come from an allowed origin, if any.
      tags:
      - github
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubAppCredentials'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubConnection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Content Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-8
      - NFR-2
      - NFR-5
    delete:
      operationId: deleteConnectorsGithubConnection
      summary: Disconnect GitHub
      description: Removes the shared connection. The body is an empty JSON object.
      tags:
      - github
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-8
  /connectors/github/connection/manifest:
    post:
      operationId: postConnectorsGithubConnectionManifest
      summary: Connect a created GitHub App
      description: Saves the app GitHub created from this instance's manifest.
      tags:
      - github
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManifestCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubConnection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Content Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-8
  /connectors/github/connection/check:
    post:
      operationId: postConnectorsGithubConnectionCheck
      summary: Check the GitHub connection
      description: Validates the saved app against GitHub and picks up its installation.
        The body is an empty JSON object.
      tags:
      - github
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubConnection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-8
  /connectors/github/repositories:
    get:
      operationId: getConnectorsGithubRepositories
      summary: List repositories
      description: Repositories the installation can access.
      tags:
      - github
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number, 1 to 10000; 1 by default.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryPage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-9
  /connectors/github/repositories/{owner}/{repo}/branches:
    get:
      operationId: getConnectorsGithubRepositoriesByOwnerByRepoBranches
      summary: List branches
      description: Branch names of a repository the installation can access.
      tags:
      - github
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
        description: Repository owner.
      - name: repo
        in: path
        required: true
        schema:
          type: string
        description: Repository name.
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number, 1 to 10000; 1 by default.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-9
  /requirements/intake:
    get:
      operationId: getRequirementsIntake
      summary: Requirements intake
      description: The questions a requirements session starts with.
      tags:
      - requirements
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intake'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-11
  /requirements/sessions:
    post:
      operationId: postRequirementsSessions
      summary: Start a requirements session
      description: Starts the interview in the repository from the intake's answers.
      tags:
      - requirements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequirementsSession'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-10
      - NFR-5
  /requirements/sessions/{session_id}:
    get:
      operationId: getRequirementsSessionsBySessionId
      summary: Get a requirements session
      description: The session's conversation, state and delivery progress.
      tags:
      - requirements
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: requirements-session- followed by 32 hex digits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsSession'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-10
  /requirements/sessions/{session_id}/messages:
    post:
      operationId: postRequirementsSessionsBySessionIdMessages
      summary: Send a message
      description: Starts the interviewer's turn on the message.
      tags:
      - requirements
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: requirements-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Content Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-10
  /requirements/sessions/{session_id}/answers:
    post:
      operationId: postRequirementsSessionsBySessionIdAnswers
      summary: Answer the interviewer's questions
      description: Answers the questions of the last assistant message and starts
        a turn.
      tags:
      - requirements
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: requirements-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswersInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-10
  /requirements/sessions/{session_id}/delivery/answers:
    post:
      operationId: postRequirementsSessionsBySessionIdDeliveryAnswers
      summary: Answer a delivery agent's questions
      description: Resumes the paused coding agent of the named stage workflow.
      tags:
      - requirements
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: requirements-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentAnswersInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-14
  /requirements/sessions/{session_id}/retry:
    post:
      operationId: postRequirementsSessionsBySessionIdRetry
      summary: Retry the last turn
      description: Runs the failed interviewer turn again.
      tags:
      - requirements
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: requirements-session- followed by 32 hex digits.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-10
  /requirements/sessions/{session_id}/generation/retry:
    post:
      operationId: postRequirementsSessionsBySessionIdGenerationRetry
      summary: Retry a delivery stage
      description: Starts the named stage of the delivery over.
      tags:
