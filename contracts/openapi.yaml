    post:
      operationId: postRequirementsSessionsBySessionIdFinalize
      summary: Finalize the requirements session
      description: 'For a new service, API change or bugfix, starts the task flow''s
        pending requirements review child (review.status running) instead of writing
        the document; each contradiction found is asked in the interview as a question,
        and once all are answered the review runs again with the diff of the requirements
        and the answers, without a limit on rounds. After a free message dropped the
        open contradiction questions (review.status contradictions_found with questions_open
        false), calling it again starts the next round, given the diff of the requirements
        since the previous round and the dropped questions marked unanswered. After
        a failed round (review.status failed), calling it starts a new round on the
        current requirements, including any changes made by messages since the failure,
        given the diff since the last finished round; POST .../review/retry instead
        reruns the failed round with its original input. The document is written,
        and the session completed, only once a round finds no contradictions or the
        user finalizes with force=true. Without force=true, calling it while a round
        is running or while the contradiction questions are open (questions_open true)
        answers 409. A documentation task writes the document at once, as before,
        and its review is not created. Once the document is written the task flow''s
        name is rewritten by the LLM from the finalized requirements, and the task
        flow starts its next pending child: the architecture (architecture_session_id)
        of a new service or an API change on a repository, or the delivery of a bugfix
        or documentation task. An API change, bugfix or documentation task is specified
        against the repository''s contract in contracts/, which must include contracts/architecture.md
        and contracts/architecture.json; 409 when the contract is missing or unreadable,
        including when either architecture file is missing. The coding agents of a
        bugfix or documentation delivery receive the repository''s existing contracts/architecture.md
        and contracts/architecture.json read-only, as context, and never change them.
        When the document is written because the session was idle for a day, no review
        runs and the task flow''s pending children, review included, close as skipped.'
