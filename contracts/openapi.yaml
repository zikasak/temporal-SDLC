  /workflows:
    get:
      operationId: getWorkflows
      summary: List workflow executions
      description: Newest first, 50 per page. type OnboardingWorkflow lists onboardings,
        whose workflow_id is the onboarding's session_id, as RequirementsWorkflow
        lists requirements sessions. Every execution also carries repository, branch
        and onboarding_id, each null when it does not apply; the existing fields keep
        their names and meaning. The optional repository, branch and onboarding_id
        filters combine with type and with each other (all must match); executions
        whose field is null never match a filter on it. The repository filter is compared
        case-insensitively, as on GitHub; the branch and onboarding_id filters must
        match exactly. A malformed filter value (a repository that is not owner/name,
        an empty branch, or an onboarding_id not of the form onboarding-session- followed
        by 32 hex digits) answers 422 with a detail, like an invalid type or page_token.
        Pass the same filters with page_token when continuing. Executions started
        before this change, which have no recorded repository, branch or onboarding
        ID, are deleted from the namespace when the change is deployed (the instance
        has no users yet), so they are not listed. top_level=true lists only the
        flows without a parent, and parent=<workflow_id> only the children of one (and
        its session's delivery runs); they cannot be combined.
      tags:
      - workflows
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: A workflow type to list only.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
        description: next_page_token of the last page.
      - name: repository
        in: query
        required: false
        schema:
          type: string
        description: Only executions working in this repository, as owner/name (its
          full_name), compared case-insensitively; 422 when not of the form owner/name.
      - name: branch
        in: query
        required: false
        schema:
          type: string
        description: Only executions working on this source branch, compared exactly;
          422 when empty.
      - name: onboarding_id
        in: query
        required: false
        schema:
          type: string
        description: Only executions started for this onboarding (onboarding-session-
          followed by 32 hex digits), compared exactly; 422 otherwise.
      - name: parent
        in: query
        required: false
        schema:
          type: string
        description: Only the children of this workflow execution, together with the
          runs of its delivery (delivery- followed by the ID); 422 when empty or malformed,
          or combined with top_level.
      - name: top_level
        in: query
        required: false
        schema:
          type: boolean
        description: true lists only executions without a parent workflow; a DeliveryWorkflow
          is never listed, as it is listed under its session.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
