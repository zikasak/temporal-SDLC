openapi: 3.1.0
info:
  title: Temporal project API
  version: 1.0.0
  description: Turns tasks described in conversation into requirements, API designs
    and verified code published to GitHub.
paths:
  /api-design/sessions:
    post:
      operationId: postApiDesignSessions
      summary: Start an API design session
      description: Continues a completed requirements session of a new service or
        an API change.
      tags:
      - api-design
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartApiDesignSession'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}:
    get:
      operationId: getApiDesignSessionsBySessionId
      summary: Get a API design session
      description: The session's conversation, state and delivery progress.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDesignSession'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-13
      - FR-34
      - FR-35
      - FR-36
      - FR-37
      - FR-38
      - FR-39
      - FR-52
      - FR-54
      - FR-55
  /api-design/sessions/{session_id}/answers:
    post:
      operationId: postApiDesignSessionsBySessionIdAnswers
      summary: Answer the interviewer's questions
      description: Answers the questions of the last assistant message and starts
        a turn.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswersInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}/delivery/answers:
    post:
      operationId: postApiDesignSessionsBySessionIdDeliveryAnswers
      summary: Answer a delivery agent's questions
      description: Resumes the paused coding agent of the named stage workflow.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentAnswersInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-14
  /api-design/sessions/{session_id}/delivery/findings/accept:
    post:
      operationId: postApiDesignSessionsBySessionIdDeliveryFindingsAccept
      summary: Accept the delivery with open review findings
      description: Clears the open-findings flag, keeps the pushed delivery as it
        is and records findings_acceptance (when and by whom) in the delivery progress.
        The publication stays marked as unverified. 409 while no flag is raised.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-30
  /api-design/sessions/{session_id}/delivery/findings/instructions:
    post:
      operationId: postApiDesignSessionsBySessionIdDeliveryFindingsInstructions
      summary: Give instructions about open review findings
      description: Starts a fix round from the instructions, then verification and
        code review, pushing the result to the same branch. The instructions are recorded
        on the review round they start. If verification fails for good, verification_status
        becomes error, the branch keeps the earlier unverified push and the flag stays
        raised. 409 while no flag is raised.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingsInstructionsInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-30
      - FR-31
  /api-design/sessions/{session_id}/document:
    get:
      operationId: getApiDesignSessionsBySessionIdDocument
      summary: Download the OpenAPI document
      description: The OpenAPI document as a file attachment; 404 until it is ready.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}/finalize:
    post:
      operationId: postApiDesignSessionsBySessionIdFinalize
      summary: Finalize the API design session
      description: Writes the OpenAPI document; the session is completed once it is
        ready.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}/fork:
    post:
      operationId: postApiDesignSessionsBySessionIdFork
      summary: Fork the session
      description: Starts a new session with the conversation up to the given message.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}/generation/retry:
    post:
      operationId: postApiDesignSessionsBySessionIdGenerationRetry
      summary: Retry a delivery stage
      description: Starts the named stage of the delivery over. The review stage runs
        a failed code review again; 409 when the delivery has no failed review. The
        repository stage pushes again and then opens or updates the pull request,
        which also recovers a pull request step that ended in error; it has the LLM
        write the pull request's title and description again, and is also allowed
        when only pull_request_text_error is set (the generic text was used). 409
        for the repository stage when there is no publication error, pull request
        error or pull request text error.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryStageInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-14
      - FR-20
      - FR-34
      - FR-36
      - FR-37
      - FR-52
      - FR-54
  /api-design/sessions/{session_id}/messages:
    post:
      operationId: postApiDesignSessionsBySessionIdMessages
      summary: Send a message
      description: Starts the interviewer's turn on the message.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-13
  /api-design/sessions/{session_id}/retry:
    post:
      operationId: postApiDesignSessionsBySessionIdRetry
      summary: Retry the last turn
      description: Runs the failed interviewer turn again.
      tags:
      - api-design
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: api-design-session- followed by 32 hex digits.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-13
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Sign in
      description: No sign-in required. Returns a session and sets the access_token
        cookie.
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-2
      - NFR-1
      - NFR-3
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Sign out
      description: No sign-in required. Clears the session cookie.
      tags:
      - auth
      responses:
        '204':
          description: No Content
      x-requirements:
      - FR-5
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Current user
      description: The signed-in user.
      tags:
      - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-4
  /auth/register:
    post:
      operationId: postAuthRegister
      summary: Register the first account
      description: No sign-in required. Registers and signs in the first account;
        403 once any account exists.
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-1
      - FR-7
      - NFR-1
  /auth/registration:
    get:
      operationId: getAuthRegistration
      summary: Registration status
      description: No sign-in required. Whether the first account can still be registered.
      tags:
      - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatus'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-1
  /auth/users:
    get:
      operationId: getAuthUsers
      summary: List accounts
      description: Administrator only.
      tags:
      - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-6
    post:
      operationId: postAuthUsers
      summary: Create an account
      description: Administrator only.
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - FR-6
      - FR-7
  /connectors/github/connection:
    get:
      operationId: getConnectorsGithubConnection
      summary: GitHub connection status
      description: The shared connection, without its private key or webhook secret;
        webhook_secret_set tells whether a secret is set.
      tags:
      - github
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubConnection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-requirements:
      - NFR-2
      - FR-50
    put:
      operationId: putConnectorsGithubConnection
      summary: Connect a GitHub App
      description: 'Saves the app after GitHub confirms its key and installation,
        with its optional webhook secret stored encrypted. This is the only way to
        add or change the webhook secret: connect again with the key and the new secret;
        leaving it out saves the connection without one. Connecting also fills in
        webhook_events_missing from the app''s subscribed events and the installation''s
        pull_requests permission. The request must be application/json and come from
        an allowed origin, if any.'
      tags:
      - github
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubAppCredentials'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubConnection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
