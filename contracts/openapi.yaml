security:
- bearer: []
components:
  schemas:
    Credentials:
      type: object
      description: A login and a password.
      properties:
        login:
          type: string
          description: An email address or a username, case-insensitive.
        password:
          type: string
      required:
      - login
      - password
    Session:
      type: object
      description: A signed-in session.
      properties:
        access_token:
          type: string
          description: Bearer token, also set as the access_token cookie.
        token_type:
          type: string
          enum:
          - bearer
        login:
          type: string
        expires_at:
          type: string
          format: date-time
        admin:
          type: boolean
          description: Whether the user is the first user.
      required:
      - access_token
      - token_type
      - login
      - expires_at
      - admin
    Profile:
      type: object
      description: The signed-in user.
      properties:
        login:
          type: string
        expires_at:
          type: string
          format: date-time
        admin:
          type: boolean
      required:
      - login
      - expires_at
      - admin
    RegistrationStatus:
      type: object
      description: Whether the first account can still be registered.
      properties:
        open:
          type: boolean
      required:
      - open
    Account:
      type: object
      description: A user account.
      properties:
        login:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - login
      - created_at
    GitHubAppCredentials:
      type: object
      description: A GitHub App to connect.
      properties:
        app_id:
          type: integer
        private_key:
          type: string
          description: The app's private key in PEM format.
        account:
          type: string
          description: The account the app is installed on, when it is installed on
            several.
        webhook_secret:
          type: string
          description: The app's webhook secret, stored encrypted and never returned.
            Without it, webhook deliveries are rejected and mentions are not handled.
      required:
      - app_id
      - private_key
    ManifestCode:
      type: object
      description: The code GitHub returned after creating an app from a manifest.
      properties:
        code:
          type: string
      required:
      - code
    EmptyObject:
      type: object
      description: An empty JSON object.
      properties: {}
    GitHubApp:
      type: object
      description: A GitHub App.
      properties:
        id:
          type: integer
        slug:
          type: string
      required:
      - id
      - slug
    GitHubInstallation:
      type: object
      description: Where the GitHub App is installed.
      properties:
        id:
          type: integer
        account:
          type: string
      required:
      - id
      - account
    GitHubConnection:
      type: object
      description: The shared GitHub connection; never its private key or webhook
        secret.
      properties:
        configured:
          type: boolean
        encryption_ready:
          type: boolean
        app:
          $ref: '#/components/schemas/GitHubApp'
          description: Null when not configured.
        installation:
          $ref: '#/components/schemas/GitHubInstallation'
          description: Null until the app is installed.
        validated_at:
          type: string
          format: date-time
        webhook_secret_set:
          type: boolean
          description: Whether the connection has a webhook secret; false when not
            configured. Mentions are handled only while it is true.
        webhook_events_missing:
          type: boolean
          description: 'True when the last connect or check found the app not subscribed
            to issue_comment or pull_request_review_comment events, or its installation
            without the pull_requests: write permission, which its owner must add
            in GitHub''s app settings because GitHub''s API cannot; mentions in comments
            of a missing event type do not arrive, and without the permission the
            app cannot reply. Filled in for every connection, manifest-created or
            manual, by connecting or checking the connection; false when not configured
            or until checked.'
      required:
      - configured
      - encryption_ready
      - webhook_secret_set
      - webhook_events_missing
    Repository:
      type: object
      description: A repository the GitHub App can access.
      properties:
        repository_id:
          type: integer
        full_name:
          type: string
        html_url:
          type: string
        private:
          type: boolean
        default_branch:
          type: string
      required:
      - repository_id
      - full_name
      - html_url
      - private
      - default_branch
    RepositoryPage:
      type: object
      description: A page of repositories.
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
        next_page:
          type: integer
          description: Null on the last page.
      required:
      - repositories
    BranchPage:
      type: object
      description: A page of branch names.
      properties:
        branches:
          type: array
          items:
            type: string
        next_page:
          type: integer
          description: Null on the last page.
      required:
      - branches
    RepositoryInput:
      type: object
      description: A repository and branch to work in.
      properties:
        full_name:
          type: string
          description: owner/name
        branch:
          type: string
      required:
      - full_name
      - branch
    RepositorySelection:
      type: object
      description: The repository a session works in.
      properties:
        provider:
          type: string
          enum:
          - github
        repository_id:
          type: integer
        full_name:
          type: string
        html_url:
          type: string
        private:
          type: boolean
        branch:
          type: string
      required:
      - provider
      - repository_id
      - full_name
      - html_url
      - private
      - branch
    Question:
      type: object
      description: A question asked of the user, with options to choose from.
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: string
      required:
      - question
      - options
    Message:
      type: object
      description: A message of a conversation.
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        attachment:
          type: object
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
          description: Asked by an assistant message; the next user message answers
            them.
      required:
      - role
      - content
    TaskKindOption:
      type: object
      description: A kind of task.
      properties:
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        label:
          type: string
      required:
      - kind
      - label
    Intake:
      type: object
      description: The questions every requirements session starts with.
      properties:
        kind_question:
          type: string
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/TaskKindOption'
        questions:
          type: object
          description: The questions of each kind, by kind, as Question lists.
        task_question:
          type: string
      required:
      - kind_question
      - kinds
      - questions
      - task_question
    CreateRequirementsSession:
      type: object
      description: The intake of a new requirements session.
      properties:
        repository:
          $ref: '#/components/schemas/RepositoryInput'
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        answers:
          type: array
          items:
            type: string
          description: One answer per question of the kind, in order.
        task:
          type: string
          description: What needs to be done; at most 10000 characters.
      required:
      - repository
      - kind
      - answers
      - task
    SessionCreated:
      type: object
      description: A session that was started.
      properties:
        session_id:
          type: string
        task_flow_id:
          type: string
          description: 'The workflow_id of the top-level task flow that holds the
            session: the new task flow started by POST /requirements/sessions, POST
            /onboarding/sessions or a fork of a requirements, architecture, API design
            or onboarding interview session. Absent for other responses.'
      required:
      - session_id
    MessageInput:
      type: object
      description: A user message.
      properties:
        message:
          type: string
          description: 1 to 10000 characters after trimming.
      required:
      - message
    AnswersInput:
      type: object
      description: Answers to the questions of the last assistant message.
      properties:
        answers:
          type: array
          items:
            type: string
          description: One per question, in order.
      required:
      - answers
    AgentAnswersInput:
      type: object
      description: Answers to the questions of a paused delivery agent.
      properties:
        workflow_id:
          type: string
          description: The stage workflow of the agent that asked.
        answers:
          type: array
          items:
            type: string
      required:
      - workflow_id
      - answers
    RetryStageInput:
      type: object
      description: The delivery stage to retry.
      properties:
        stage:
          type: string
          enum:
          - server
          - tests
          - documentation
          - repository
          - review
          description: review runs a failed code review again on the verified delivery.
            repository pushes the delivery again and then opens or updates its pull
            request, such as after pull_request_status became error; it also has the
            LLM write the pull request's title and description again, such as after
            pull_request_text_error was set.
      required:
      - stage
    ForkInput:
      type: object
      description: Where a fork starts.
      properties:
        message_index:
          type: integer
          description: The last message the fork keeps.
      required:
      - message_index
    SessionStatusChange:
      type: object
      description: A session after an accepted request.
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - preparing
          - awaiting_confirmation
          - declined
          - drafting
          - interviewing
          - turn_running
          - finalizing
          - completed
          - skipped
          - failed
          - superseded
          description: awaiting_confirmation, declined and superseded occur only for
            onboardings; drafting for onboardings and architecture sessions; skipped
            only for architecture sessions.
        verification_status:
          type: string
          description: As in ApiDesignSession, including reviewing and findings_open.
      required:
      - session_id
    Requirement:
      type: object
      description: A requirement of the task.
      properties:
        id:
          type: string
        category:
          type: string
          enum:
          - functional
          - non_functional
          - technical
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum:
          - must
          - should
          - could
        rationale:
          type: string
      required:
      - id
      - category
      - title
      - description
      - priority
    RequirementsSession:
      type: object
      description: A requirements session and its delivery.
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - preparing
          - interviewing
          - turn_running
          - finalizing
          - completed
          - failed
          description: finalizing also while the requirements review runs; interviewing
            again while the user answers the contradiction questions or after a failed
            review round; completed once the document is written.
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        retired:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: Requirements of the repository's contract the change ends.
        lookup_requirements:
          type: array
          items:
            $ref: '#/components/schemas/LookupRequirement'
          description: 'Every requirement a requirement ID mentioned in the conversation
            or in the delivery''s agent questions can refer to: those recorded in
            the session, the existing service''s and those the task retires (retired
            true). Empty when there are none.'
        review:
          $ref: '#/components/schemas/RequirementsReview'
          description: The requirements review's status, round, contradictions and
            any reviewer error. not_started until finalize; skipped for a documentation
            task or an idle-written session. A fork copies the review state of the
            session it was forked from at the fork point.
        document:
          type: object
          description: The requirements document, once written; when the user continued
            despite contradictions, it lists those that remained.
        error:
          type: string
        forked_from:
          type: object
        repository:
          $ref: '#/components/schemas/RepositorySelection'
        checkout:
          type: object
        contract_commit:
          type: string
        task_flow_id:
          type: string
          description: The workflow_id of the top-level task flow (TaskWorkflow) the
            session is a child of. Null only for sessions started before task flows
            existed. The requirements review and the delivery of a bugfix or documentation
            task are found with GET /workflows?parent=<task_flow_id>; no separate
            review or delivery ID is returned.
        architecture_session_id:
          type: string
          description: The architecture session the task flow started from its pending
            architecture child once the requirements review of a new service or an
            API change passed or the user continued despite it; it drafts the architecture
            at once, as a child of the task flow (task_flow_id). Null until then,
            for any other kind of task, for a session without a repository, and for
            one whose document was written because it was idle for a day (its later
            stages are then skipped). The API design is found through the architecture
            session.
        delivery:
          type: object
          description: Progress of the delivery of a bugfix or documentation task,
            which runs as the delivery child of the task flow, started for a bugfix
            once its requirements review passed or the user continued despite it.
            A bugfix's progress also holds reviews (ReviewRound list), review_error,
            the open_findings flag, findings_acceptance (FindingsAcceptance), the
            reviewing and findings_open verification_status values and the publication
            (RepositoryPublication) with its verified flag, the first 20 open findings
            its commit message lists and findings_count, as in ApiDesignSession. Every
            delivery's progress also holds pull_request_status and, once a pushed
            delivery's pull request is open, pull_request (PullRequest), pull_request_error,
            pull_request_text_error, mentions (PullRequestMention list) of the app
            on that pull request and fix_flow_ids (the new task flows started by fix
            rounds after the flow closed), as in ApiDesignSession.
      required:
      - session_id
      - status
      - messages
      - requirements
      - retired
      - lookup_requirements
      - review
    ApiDesignSession:
      type: object
      description: An API design session and its delivery.
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - preparing
          - interviewing
          - turn_running
          - finalizing
          - completed
          - failed
        source_session_id:
          type: string
          description: The requirements session of the task.
        task_flow_id:
          type: string
          description: The workflow_id of the top-level task flow (TaskWorkflow) the
            design is a child of; the delivery started when the design is finalized
            is a child of the same task flow. Null only for designs started before
            task flows existed.
        architecture_session_id:
          type: string
          description: The architecture session whose finalization or confirmed skip
            made the task flow start this design; both are children of the task flow
            (task_flow_id).
        architecture:
          type: string
          description: 'The architecture the design and the delivery''s coding agents
            are given, as Markdown: the finalized architecture, or the repository''s
            existing contracts/architecture.md when an API change skipped the stage.
            It is committed as contracts/architecture.md when the delivery is pushed
            (unchanged when skipped).'
        architecture_structure:
          $ref: '#/components/schemas/ArchitectureStructure'
          description: The same architecture in machine-readable form, committed as
            contracts/architecture.json when the delivery is pushed (unchanged when
            skipped).
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        lookup_requirements:
          type: array
          items:
            $ref: '#/components/schemas/LookupRequirement'
          description: 'Every requirement a requirement ID mentioned in the conversation
            or in the delivery''s agent questions can refer to: those recorded in
            the task''s requirements session, the existing service''s and those the
            task retires (retired true). Empty when there are none.'
        api:
          type: object
          description: The designed endpoints and schemas.
        language:
          type: string
          description: The implementation language, once chosen.
        document:
          type: object
          description: The OpenAPI document, once rendered.
        error:
          type: string
        forked_from:
          type: object
        repository:
          $ref: '#/components/schemas/RepositorySelection'
        checkout:
          type: object
        problems:
          type: array
          items:
            type: string
          description: What must be settled before the design can be finalized.
        verification_status:
          type: string
          enum:
          - not_applicable
          - waiting
          - running
          - diagnosing
          - repairing
          - reviewing
          - completed
          - findings_open
          - skipped
          - error
          description: reviewing while the code review runs; findings_open when the
            tests pass but review findings remained after the last review round; error
            also when verification fails for good in a round started by the user's
            instructions, or when the code review failed (see review_error).
        publication_status:
          type: string
        verification:
          type: object
        publication:
          $ref: '#/components/schemas/RepositoryPublication'
          description: The branch the delivery pushed, with the commit and the open
            review findings its message lists. Its verified flag is false for documentation
            without a check and for code pushed with open review findings.
        agent_questions:
          type: array
          items:
            type: object
          description: 'Open questions of paused coding agents, one entry per waiting
            agent: workflow_id (the stage workflow the answers are sent to through
            POST .../delivery/answers), stage (which agent asked: implementation,
            tests, documentation or diagnosis) and questions (Question list). The
            web client shows them in the panel''s left column, where the interviewer''s
            open questions are shown, not in the delivery progress section; each agent''s
            group is answered separately. Unchanged in shape and content. The other
            delivery progress fields (code, implementation, tests, repairs and their
            errors) are returned alongside.'
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewRound'
          description: Every code review round of the delivery, oldest first, with
            each finding's worker and the reason for it and, for rounds the user started,
            their instructions.
        review_error:
          type: string
          description: Why the last code review failed to run, such as an LLM error;
            the review stage can then be retried. Cleared when a review completes.
        open_findings:
          type: boolean
          description: Raised when findings remained after the last review round and
            the delivery was pushed as unverified; the user accepts it or gives instructions.
            It stays raised when verification fails for good in a round started by
            instructions, and the branch keeps the earlier unverified push.
        findings_acceptance:
          $ref: '#/components/schemas/FindingsAcceptance'
          description: Set when the user accepted the delivery with its open review
            findings as it is.
        pull_request_status:
          type: string
          enum:
          - not_applicable
          - waiting
          - running
          - completed
          - skipped
          - error
          description: 'The pull request step after the push, with the same values
            as publication_status: waiting until the branch is pushed, running while
            the pull request is opened or updated, completed once it is open or updated,
            skipped when nothing was pushed, error when it could not be opened or
            updated (see pull_request_error). An error never fails the push or the
            delivery; retrying the repository stage pushes again and retries the pull
            request. Falling back to the generic title and description is not an error:
            the step still completes (see pull_request_text_error).'
        pull_request:
          $ref: '#/components/schemas/PullRequest'
          description: The pull request opened from the pushed branch to the default
            branch, once it is open. A later push to the same branch keeps an open
            pull request and rewrites both its title and its description, and marks
            a draft ready for review when that push is verified. If the earlier pull
            request was closed or merged, the later push opens a new one and this
            field links to it. When updating it fails, this field keeps the existing
            pull request.
        pull_request_error:
          type: string
          description: 'Why the pull request could not be opened or updated, such
            as the GitHub App installation lacking the pull_requests: write permission,
            or a network or GitHub API error. Reported the same way whether opening
            or updating failed. The push and the delivery do not fail because of it;
            retrying the repository stage tries again. Cleared when the pull request
            step completes.'
        pull_request_text_error:
          type: string
          description: 'Why the LLM could not write the pull request''s title and
            description at the last open or update, such as the LLM being unavailable,
            so the generic text was used instead: today''s generic title for the task
            kind (with the " (unverified)" marker for an unverified delivery) and
            a generic description made of today''s fixed sentence of what the delivery
            changed, followed only by the open review findings when there are any.
            The push, the pull request step and the delivery do not fail because of
            it. While it is set, the repository stage can be retried: it pushes again
            and has the LLM write the title and description again. Cleared when a
            later open or update uses LLM-written text.'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/PullRequestMention'
          description: Every authorised mention of the GitHub App on the delivery's
            pull request, oldest first, with its classification and the fix round
            or reply it led to. Fix rounds a mention starts are recorded in reviews
            like rounds started by instructions, with the comment's text as their
            instructions.
        fix_flow_ids:
          type: array
          items:
            type: string
          description: 'The workflow_ids of the new top-level task flows started by
            fix rounds after this delivery''s flow completed or was cancelled, oldest
            first: one per instructions given about its open review findings and per
            fix request mentioned on its closed or merged pull request. Each is a
            new TaskWorkflow, with the original''s origin and named after the original
            with a " (fix)" suffix, that holds the fix delivery as its child and links
            to the original task''s stages, for a task''s delivery and an onboarding''s
            alike. Empty or absent while none was started.'
      required:
      - session_id
      - status
      - source_session_id
      - messages
      - requirements
      - lookup_requirements
      - api
      - problems
      - verification_status
      - publication_status
      - pull_request_status
    LLMRequestInput:
      type: object
      description: A chat request. Also accepted as multipart form data with one file.
      properties:
        message:
          type: string
        parent_request_id:
          type: string
        fork_after:
          type: integer
        repository:
          $ref: '#/components/schemas/RepositoryInput'
      required:
      - message
    LLMRequestStarted:
      type: object
      description: A chat request that is running.
      properties:
        request_id:
          type: string
        status:
          type: string
          enum:
          - running
      required:
      - request_id
      - status
    LLMRequest:
      type: object
      description: A chat request and its conversation.
      properties:
        request_id:
          type: string
        status:
          type: string
        result:
          type: string
        error:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        parent_request_id:
          type: string
        generated_documents:
          type: array
          items:
            type: object
        repository:
          $ref: '#/components/schemas/RepositorySelection'
      required:
      - request_id
      - status
      - messages
      - generated_documents
    WorkflowExecution:
      type: object
      description: A workflow execution.
      properties:
        workflow_id:
          type: string
        run_id:
          type: string
        workflow_type:
          type: string
          description: Includes TaskWorkflow, the top-level flow of a task or onboarding
            started by a new requirements interview, a new onboarding, a fork of a
            requirements, architecture, API design or onboarding interview session,
            or a fix round on a closed delivery; and RequirementsReviewWorkflow, the
            requirements review child of a task flow.
        status:
          type: string
          description: The Temporal status in lower case (running, completed, cancelled,
            ...), except that a stage child of a task flow that was created but still
            waits for the stages it depends on is listed as pending, and one that
            will never run (such as a confirmed architecture skip, the review of a
            documentation task or an architecture-only onboarding, or the stages after
            a session whose document was written because it was idle for a day) as
            skipped. An open task flow is running; it closes with its delivery child's
            status (cancelled when the delivery was skipped) once every child, linked
            earlier stages included, has closed.
        task_queue:
          type: string
        parent_workflow_id:
          type: string
          description: For a stage of a task or onboarding, the task flow's workflow_id.
            For a linked earlier stage listed under a forked or fix-round task flow,
            still its own task flow.
        start_time:
          type: string
          format: date-time
        close_time:
          type: string
          format: date-time
        repository:
          $ref: '#/components/schemas/RepositorySelection'
          description: Always present. The repository the execution works in, as in
            the session's repository (provider, repository_id, full_name, html_url,
            private and the source branch), for TaskWorkflow, OnboardingWorkflow,
            RequirementsWorkflow, RequirementsReviewWorkflow, ArchitectureWorkflow,
            ApiDesignWorkflow and DeliveryWorkflow executions, and for CodegenWorkflow
            executions the repository of the delivery that started them; null for
            any other execution, such as a chat.
        branch:
          type: string
          description: Always present. The branch the execution works in (the source
            branch the session checked out, not a branch the delivery pushes; the
            same as repository.branch), for the same executions as repository; null
            for any other execution, such as a chat.
        name:
          type: string
          description: 'Always present. For a TaskWorkflow, its current short name:
            written by an LLM from the intake''s task at start and rewritten from
            the finalized requirements; a task flow started by a fork or a fix round
            copies the original task''s name with a " (fork)" or " (fix)" suffix.
            Null for any other execution.'
        origin:
          type: string
          enum:
          - requirements
          - onboarding
          description: Always present. For a TaskWorkflow, requirements when it was
            started by a requirements interview (or a fork or fix round of one) and
            onboarding when it was started by an onboarding (or a fork or fix round
            of one). Null for any other execution.
        linked:
          type: boolean
          description: Always present. True when the execution is listed under parent=<task
            flow> as an earlier stage of another task that this forked or fix-round
            task flow links to, not as its own child; false otherwise.
        waiting_for_user:
          type: boolean
          description: Always present. Whether the flow waits for the user (unanswered
            interviewer or contradiction questions, a failed requirements review round,
            a coding agent's questions, open review findings, a skip proposal or a
            contract decision); for a task flow, whether any of its children does.
            Always false for a closed flow. Null for executions started before this
            change and for executions that cannot wait for the user.
        unresolved_findings:
          type: boolean
          description: Always present. Whether the flow's delivery has open review
            findings that were not accepted; for a task flow, whether its delivery
            child has. Stays true after the flow closed until the findings are accepted.
            Null for executions started before this change and for executions without
            a delivery.
      required:
      - workflow_id
      - run_id
      - workflow_type
      - status
      - task_queue
      - start_time
    WorkflowPage:
      type: object
      description: A page of workflow executions.
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowExecution'
        next_page_token:
          type: string
      required:
      - workflows
    ReviewFinding:
      type: object
      description: A problem the code review found in the delivery's own changes.
      properties:
        summary:
          type: string
          description: What is wrong and why it needs a correction.
        path:
          type: string
          description: The changed file the finding is about, when it is about one.
        target:
          type: string
          enum:
          - implementation
          - tests
          - both
          description: The worker the finding was sent to.
        reason:
          type: string
          description: Briefly, why the finding was sent to that worker.
        unresolved:
          type: string
          description: 'On a finding left open that no author of the delivery could
            settle, why: failing repository tests that no author may change assert
            otherwise, or the review still found it after its corrections.'
      required:
      - summary
      - target
      - reason
    ReviewRound:
      type: object
      description: One code review round of a delivery.
      properties:
        round:
          type: integer
          description: Numbered from 1 across the whole delivery. Each run of review
            rounds, including the run started by the user's instructions, is limited
            to 5 apart from test repair rounds, so numbers above 5 come from instructed
            runs.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ReviewFinding'
          description: Empty when the review found nothing worth correcting.
        instructions:
          type: string
          description: The user's instructions about open review findings that the
            fixes reviewed in this round were made from; absent for rounds the user
            did not start.
      required:
      - round
      - findings
    FindingsInstructionsInput:
      type: object
      description: What the user wants done about the open review findings.
      properties:
        instructions:
          type: string
          description: 1 to 10000 characters after trimming.
      required:
      - instructions
    FindingsAcceptance:
      type: object
      description: The user's acceptance of a delivery pushed with open review findings.
      properties:
        accepted_at:
          type: string
          format: date-time
        accepted_by:
          type: string
          description: Login of the user who accepted the delivery as it is.
      required:
      - accepted_at
      - accepted_by
    RepositoryPublication:
      type: object
      description: The branch a delivery was pushed to.
      properties:
        branch:
          type: string
        commit:
          type: string
          description: SHA of the pushed commit.
        url:
          type: string
        verified:
          type: boolean
          description: False for documentation without a check and for code pushed
            with open review findings; the commit message says so too.
        ignored:
          type: array
          items:
            type: string
          description: Verified paths left out because the repository's .gitignore
            matches them (first few).
        ignored_count:
          type: integer
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ReviewFinding'
          description: The first 20 open review findings, as the pushed commit's message
            lists them; empty or absent when the commit was pushed without open findings.
        findings_count:
          type: integer
          description: The number of all open review findings at the push, including
            those beyond the first 20; the commit message states it too. 0 or absent
            without open findings.
      required:
      - branch
      - commit
      - url
      - verified
      - ignored
      - ignored_count
    PullRequest:
      type: object
      description: The pull request opened from a delivery's pushed branch to the
        repository's default branch.
      properties:
        number:
          type: integer
          description: The pull request's number in the repository.
        title:
          type: string
          description: The pull request's title on GitHub, at most 200 characters.
            Written by an LLM from the task, its requirements and the delivery's code
            diff, naming the specific change, and written again on every later push
            that updates the pull request; for an unverified delivery followed by
            the " (unverified)" marker. When the LLM cannot write it, today's generic
            title for the task kind is used instead, with the same marker (see pull_request_text_error).
        url:
          type: string
          format: uri
          description: Link to the pull request on GitHub.
        draft:
          type: boolean
          description: 'True while the last push to its branch was an unverified delivery:
            documentation without a check or code pushed with open review findings.
            A later verified push to the same branch marks the pull request ready
            for review, and draft becomes false.'
        base:
          type: string
          description: The default branch the pull request targets.
      required:
      - number
      - title
      - url
      - draft
      - base
    PullRequestMention:
      type: object
      description: An authorised mention of the GitHub App on the delivery's pull
        request and what it led to.
      properties:
        comment_id:
          type: integer
          description: GitHub's ID of the comment.
        comment_type:
          type: string
          enum:
          - conversation
          - review
          description: A pull request conversation comment or an inline review comment.
        url:
          type: string
          format: uri
          description: Link to the comment on GitHub.
        author:
          type: string
          description: GitHub login of the comment's author.
        body:
          type: string
          description: The comment's text.
        received_at:
          type: string
          format: date-time
        classification:
          type: string
          enum:
          - pending
          - fix
          - clarification
          - unclear
          description: pending until the LLM has classified the mention.
        status:
          type: string
          enum:
          - classifying
          - queued
          - running
          - replied
          - completed
          - error
          description: queued while a fix request waits for the running fix round;
            running while its round runs; replied once a clarification or an unclear
            mention was answered; completed once a fix round's result was pushed;
            error when classifying, replying or the fix round failed (see error).
        round:
          type: integer
          description: The first review round of the fix round the mention started,
            as numbered in reviews. Absent for a fix round that runs in a new flow
            (see fix_flow_id).
        fix_flow_id:
          type: string
          description: The workflow_id of the new top-level task flow the mention's
            fix request started because the delivery's flow had completed or been
            cancelled (merged or closed pull request); it holds the fix delivery as
            its child, for a task's delivery and an onboarding's alike. Also listed
            in fix_flow_ids. Absent for any other mention.
        reply_url:
          type: string
          format: uri
          description: Link to the app's last reply to the mention in the pull request.
        error:
          type: string
          description: What failed, as also replied in the pull request.
      required:
      - comment_id
      - comment_type
      - url
      - author
      - body
      - received_at
      - classification
      - status
    GitHubWebhookEvent:
      type: object
      description: A GitHub webhook payload, as GitHub sends it; only the fields used
        are listed and any others are allowed.
      properties:
        action:
          type: string
          description: Such as created.
        comment:
          type: object
          description: The conversation or inline review comment, with its id, body,
            html_url and user.
        issue:
          type: object
          description: 'For issue_comment: the pull request as an issue, with number
            and pull_request.'
        pull_request:
          type: object
          description: 'For pull_request_review_comment: the pull request.'
        repository:
          type: object
        installation:
          type: object
        sender:
          type: object
    CreateOnboardingSession:
      type: object
      description: The repository and branch to onboard.
      properties:
        repository:
          $ref: '#/components/schemas/RepositoryInput'
      required:
      - repository
    OnboardingSession:
      type: object
      description: 'An onboarding of an existing repository: the drafted contract,
        the review interview and the delivery of the contract, contract tests and
        Dockerfile, or of contracts/architecture.md alone. Every signed-in user can
        reopen any onboarding.'
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - preparing
          - awaiting_confirmation
          - declined
          - drafting
          - interviewing
          - turn_running
          - finalizing
          - completed
          - failed
          - superseded
          description: awaiting_confirmation while the branch has a contract in contracts/,
            contract tests or a root Dockerfile and the user has not yet decided,
            at the start or again after a checkout update found ones not there before;
            declined once the user chose decline, which ends the onboarding without
            changing anything; drafting while the LLM drafts the requirements, the
            architecture, the API and the language from the existing code (only the
            architecture for an architecture-only onboarding); preparing also while
            the checkout is updated; finalizing also while the requirements review
            runs, interviewing again while the user answers its contradiction questions
            or after a failed review round; superseded once the onboarding was forked,
            which ends it so that only the fork stays unfinished.
        repository:
          $ref: '#/components/schemas/RepositorySelection'
        task_flow_id:
          type: string
          description: The workflow_id of the top-level task flow (TaskWorkflow with
            origin onboarding) the onboarding interview is a child of, together with
            its requirements review and delivery. Null for onboardings started before
            onboardings ran under task flows.
        checkout:
          type: object
          description: The commit the onboarding is checked out at; changes when the
            checkout is updated.
        forked_from:
          type: object
          description: The onboarding and message this one was forked from.
        existing_contract:
          type: boolean
          description: Whether the branch had a contract in contracts/, contract tests
            in contract-tests/ or a root Dockerfile at the start or the last checkout
            update; true exactly when existing_artifacts is not empty.
        existing_artifacts:
          type: array
          items:
            type: string
            enum:
            - contract
            - contract_tests
            - dockerfile
          description: What the branch had at the start, refreshed by each checkout
            update, and the onboarding would replace; empty when it had none of them.
        architecture_missing:
          type: boolean
          description: True when the branch has a contract in contracts/ but lacks
            contracts/architecture.md or contracts/architecture.json (both are required),
            at the start or the last checkout update; only then is the architecture_only
            decision offered.
        replaced_contract:
          type: boolean
          description: Whether the user chose to replace what existing_artifacts lists
            (decision replace).
        architecture_only:
          type: boolean
          description: 'Whether the user chose to add only contracts/architecture.md
            (decision architecture_only): only the architecture is drafted and reviewed,
            requirements, api and language stay empty, and the result is pushed with
            a pull request without requirements review, contract tests, verification
            or code review.'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: The drafted requirements, as corrected in the interview; empty
            for an architecture-only onboarding.
        lookup_requirements:
          type: array
          items:
            $ref: '#/components/schemas/LookupRequirement'
          description: 'Every requirement a requirement ID mentioned in the conversation
            or in the delivery''s agent questions can refer to: the drafted requirements
            and the existing contract''s requirements, with retired false. Empty when
            there are none.'
        review:
          $ref: '#/components/schemas/RequirementsReview'
          description: 'The requirements review of the drafted requirements: status,
            round, contradictions and any reviewer error. not_started until finalize;
            skipped for an architecture-only onboarding. A fork copies the review
            state of the onboarding it was forked from at the fork point.'
        architecture:
          type: string
          description: The architecture drafted by the LLM from the existing code,
            as Markdown with the fixed headings (Components with their responsibilities,
            Data flow, Technology choices), rendered from architecture_structure as
            corrected in the interview; written to contracts/architecture.md. Null
            until drafted.
        architecture_structure:
          $ref: '#/components/schemas/ArchitectureStructure'
          description: The same architecture in machine-readable form; written to
            contracts/architecture.json. Null until drafted.
        api:
          type: object
          description: The drafted endpoints and schemas, as corrected in the interview;
            empty for an architecture-only onboarding.
        language:
          type: string
          description: The implementation language of the existing code, as the LLM
            detected it from the code and the user may correct it in the interview;
            written to contracts/language.json. Null for an architecture-only onboarding.
        problems:
          type: array
          items:
            type: string
          description: What must be settled before the onboarding can be finalized.
        error:
          type: string
        delivery:
          type: object
          description: 'Progress of the delivery child of the onboarding''s task flow,
            which verifies and publishes the contract, contract tests and Dockerfile,
            with the same fields as an ApiDesignSession''s delivery progress: verification_status,
            publication_status, verification, publication (its branch named onboarding/<source
            branch>-<short id>), agent_questions (including a coding agent''s question
            whether a failing test reveals a bug in the existing code, which waits
            for an answer without a timeout), reviews, review_error, open_findings,
            findings_acceptance, pull_request_status, pull_request, pull_request_error,
            pull_request_text_error, mentions and fix_flow_ids (the new onboarding
            task flows started by fix rounds after the onboarding closed). When the
            existing code was changed after the user confirmed a bug, the result is
            still verified as usual once the tests pass, and the pushed commit''s
            message and the pull request''s description say that the existing code
            was changed. For an architecture-only onboarding, verification_status
            is not_applicable, reviews stay empty and open_findings is never raised;
            only the publication of contracts/architecture.md and contracts/architecture.json
            and its pull request are reported.'
      required:
      - session_id
      - status
      - repository
      - existing_contract
      - existing_artifacts
      - architecture_missing
      - replaced_contract
      - architecture_only
      - messages
      - requirements
      - lookup_requirements
      - review
      - api
      - problems
    ContractDecisionInput:
      type: object
      description: The user's choice about the contract, contract tests or root Dockerfile
        the branch already has.
      properties:
        decision:
          type: string
          enum:
          - replace
          - decline
          - architecture_only
          description: replace replaces everything listed in existing_artifacts and
            the onboarding proceeds to drafting the full contract; decline ends the
            onboarding as declined and leaves the existing files unchanged; architecture_only,
            allowed only while architecture_missing is true, drafts only contracts/architecture.md
            from the existing code and leaves every other file of the existing contract,
            the contract tests and the Dockerfile unchanged. Replaces the former replace_contract
            boolean.
      required:
      - decision
    SkipProposal:
      type: object
      description: The LLM's proposal, made instead of the initial draft, to skip
        the architecture stage of an API change, waiting for the user.
      properties:
        reason:
          type: string
          description: Why the LLM judges that the task needs no new architecture.
        message_index:
          type: integer
          description: The assistant message that made the proposal.
      required:
      - reason
      - message_index
    ArchitectureSession:
      type: object
      description: 'An architecture session: the LLM''s draft of the task''s top-level
        architecture and the review conversation.'
      properties:
        session_id:
          type: string
          description: architecture-session- followed by 32 hex digits.
        status:
          type: string
          enum:
          - preparing
          - drafting
          - interviewing
          - turn_running
          - finalizing
          - completed
          - skipped
          - failed
          description: drafting while the LLM drafts the architecture from the requirements
            (for an API change starting from the repository's contracts/architecture.md),
            or decides instead to propose skipping the stage; skipped once the user
            skipped the stage.
        source_session_id:
          type: string
          description: The requirements session of the task whose finalized requirements
            this architecture is drafted from (a sibling under the same task flow,
            or the linked earlier stage of a forked task flow).
        task_flow_id:
          type: string
          description: The workflow_id of the top-level task flow (TaskWorkflow) the
            session is a child of. Null only for sessions started before task flows
            existed.
        kind:
          type: string
          enum:
          - new_service
          - api_change
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        lookup_requirements:
          type: array
          items:
            $ref: '#/components/schemas/LookupRequirement'
          description: 'Every requirement a requirement ID mentioned in the conversation
            can refer to: those recorded in the task''s requirements session, the
            existing service''s and those the task retires (retired true). Empty when
            there are none.'
        architecture:
          type: string
          description: 'The current draft as Markdown, rendered from structure with
            fixed headings: Components (with their responsibilities), Data flow and
            Technology choices. Null until drafted, including while a skip proposal
            made instead of the initial draft is open.'
        structure:
          $ref: '#/components/schemas/ArchitectureStructure'
          description: The current draft in machine-readable form, written to contracts/architecture.json
            when the delivery is pushed. Null until drafted.
        skip_proposal:
          $ref: '#/components/schemas/SkipProposal'
          description: The LLM's open proposal to skip the stage. Only for an API
            change and only made instead of the initial draft; null when none is open.
            Once declined (by sending a message) it is dismissed, the architecture
            is drafted and no skip is proposed again in the session.
        skip_declined:
          type: boolean
          description: True once the user declined the skip proposal; the LLM proposes
            no further skip in this session.
        document:
          type: object
          description: The architecture document (contracts/architecture.md and contracts/architecture.json),
            once finalized.
        error:
          type: string
        forked_from:
          type: object
        repository:
          $ref: '#/components/schemas/RepositorySelection'
        checkout:
          type: object
        problems:
          type: array
          items:
            type: string
          description: What must be settled before the architecture can be finalized.
        api_design_session_id:
          type: string
          description: The API design the task flow started from its pending API design
            child when this session was finalized or its skip confirmed, a child of
            the task flow (task_flow_id); null until then.
      required:
      - session_id
      - status
      - source_session_id
      - kind
      - messages
      - requirements
      - lookup_requirements
      - skip_declined
      - problems
    ArchitectureComponent:
      type: object
      description: A component or module of the architecture.
      properties:
        name:
          type: string
        responsibilities:
          type: array
          items:
            type: string
          description: What the component is responsible for.
      required:
      - name
      - responsibilities
    ArchitectureDataFlow:
      type: object
      description: Data passed from one component to another.
      properties:
        source:
          type: string
          description: Name of the component the data comes from.
        target:
          type: string
          description: Name of the component the data goes to.
        description:
          type: string
          description: What data flows and how.
      required:
      - source
      - target
      - description
    ArchitectureTechnologyChoice:
      type: object
      description: A key technology choice.
      properties:
        topic:
          type: string
          description: What the choice is about, such as storage or messaging.
        choice:
          type: string
        rationale:
          type: string
      required:
      - topic
      - choice
    ArchitectureStructure:
      type: object
      description: The machine-readable architecture, written to contracts/architecture.json;
        contracts/architecture.md is rendered from it with fixed headings (Components,
        Data flow, Technology choices).
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/ArchitectureComponent'
        data_flows:
          type: array
          items:
            $ref: '#/components/schemas/ArchitectureDataFlow'
        technology_choices:
          type: array
          items:
            $ref: '#/components/schemas/ArchitectureTechnologyChoice'
      required:
      - components
      - data_flows
      - technology_choices
    LookupRequirement:
      type: object
      description: 'A requirement a requirement ID mentioned in the conversation can
        refer to, for the web client to show on hover or tap. The list holds one entry
        per ID and every requirement that applies, without a size limit: when the
        session records a requirement with the same ID as one of the existing service,
        the session''s version is listed, and an ID the task retires is listed with
        retired true. For a session without an existing service (a new service, or
        an onboarding of a branch without a contract), it holds only the requirements
        recorded or drafted in the session.'
      properties:
        id:
          type: string
          description: 'The requirement''s ID in canonical form: upper-case prefix,
            a dash and the number (PREFIX-NUMBER), such as FR-12, whatever form it
            was recorded in. The client matches fr12, FR12 or fr-12 to it by upper-casing
            and inserting the dash.'
        category:
          type: string
          enum:
          - functional
          - non_functional
          - technical
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum:
          - must
          - should
          - could
        retired:
          type: boolean
          description: True when the task retires this requirement of the existing
            service.
      required:
      - id
      - category
      - title
      - description
      - priority
      - retired
    Contradiction:
      type: object
      description: A contradiction the requirements review found between requirements.
      properties:
        id:
          type: string
          description: Stable ID of the contradiction, C- followed by a number (C-1,
            C-2, ...), unique across all rounds of the task's review. A contradiction
            the reviewer reports again in a later round keeps its ID; a new one gets
            the next number. The requirements document refers to remaining contradictions
            by it.
        summary:
          type: string
          description: What contradicts what, and why.
        requirement_ids:
          type: array
          items:
            type: string
          description: 'The conflicting requirements, in canonical form (such as FR-12):
            recorded or drafted in the session, or of the existing service (or, for
            an onboarding replacing a contract, of that contract) and not retired
            by the task.'
        question:
          $ref: '#/components/schemas/Question'
          description: The question asked of the user on how to resolve it; all of
            a round's questions are asked in one assistant message, in the order of
            the contradictions, and answered through POST .../answers.
      required:
      - id
      - summary
      - requirement_ids
      - question
    RequirementsReview:
      type: object
      description: The state of the task's requirements review (RequirementsReviewWorkflow,
        a child of the task flow). The Flows page shows a review flow by opening its
        requirements or onboarding session in the panel and reading this field, including
        the contradictions that remained when the user continued anyway.
      properties:
        status:
          type: string
          enum:
          - not_started
          - running
          - passed
          - contradictions_found
          - failed
          - continued_anyway
          - skipped
          description: not_started until the session is finalized; running while a
            round runs; passed when a round found no contradictions; contradictions_found
            after a round reported contradictions, both while the user answers their
            questions and after a free message dropped them (see questions_open);
            failed when the round's LLM call failed for good (see error), handled
            like contradictions_found with none listed, and kept after free messages
            until a round runs again (POST .../review/retry reruns the failed round
            with its original input; POST .../finalize starts a new round on the current
            requirements, whether or not messages changed them since the failure);
            continued_anyway once finalized with force=true; skipped for documentation,
            a requirements session or onboarding whose document was written because
            it was idle for a day, or an architecture-only onboarding.
        round:
          type: integer
          description: 'The current or last round, numbered from 1; 0 before the first
            round. Rounds are unlimited. A failed round keeps its number: POST .../review/retry
            reruns it under the same number, while a new round started by POST .../finalize
            after the failure gets the next number.'
        contradictions:
          type: array
          items:
            $ref: '#/components/schemas/Contradiction'
          description: The contradictions the last finished round reported, in the
            order their questions are asked; still listed after a free message dropped
            their questions; when continued_anyway, those that remained and are listed
            in the requirements document. Empty when none.
        questions_open:
          type: boolean
          description: True while the last round's contradiction questions can be
            answered through POST .../answers, which then starts the next round. Turns
            false when a free message drops them; status stays contradictions_found
            and finalizing again (POST .../finalize) starts the next round, given
            the diff of the requirements and the dropped questions marked unanswered.
            False in every other status.
        error:
          type: string
          description: Why the last round failed; the round can be retried with its
            original input under the same number, a new round with the next number
            started on the current requirements by finalizing again, or the review
            forced past. Null otherwise.
      required:
      - status
      - round
      - contradictions
      - questions_open
    ModelSettings:
      type: object
      description: The adapter, model, thinking level and compaction threshold of
        one LLM workflow type.
      properties:
        adapter:
          type: string
          enum:
          - pi
          - openai
          - claude
        model:
          type: string
          description: 1 to 300 characters, without control characters.
        thinking_level:
          type: string
          description: 1 to 100 characters; one the model offers.
        compaction_tokens:
          type: integer
          description: 'Tokens in use at which the coding agents of Pi and the openai
            adapter compact their history into a checkpoint: 0 never compacts, otherwise
            at least 4000 and, when the provider reports the model''s context window,
            at most that window (422 otherwise). Defaults to 48000 when omitted; always
            present in responses. Not checked or used for claude, which compacts its
            own context.'
      required:
      - adapter
      - model
      - thinking_level
    WorkflowSettings:
      type: object
      description: The model settings of every LLM workflow type.
      properties:
        workflows:
          type: object
          description: 'ModelSettings by workflow type; must hold exactly every type:
            chat, requirements, requirements_review (the requirements reviewer of
            tasks and onboardings, separate from review, the code review), api_design,
            implementation, test_generation, diagnosis, documentation, review and
            routing; 422 otherwise.'
      required:
      - workflows
    AgentSettings:
      type: object
      description: The settings shared by the agents of every workflow type.
      properties:
        contract_embed_chars:
          type: integer
          description: 1000 to 10000000 (422 otherwise); default 32000. Contracts
            whose embedded form is longer reach coding agents as an index plus read-only
            files instead of whole.
      required:
      - contract_embed_chars
    SettingsView:
      type: object
      description: The stored settings with the labels and the selectable models.
      properties:
        workflows:
          type: object
          description: ModelSettings by workflow type, including requirements_review.
            A workflow type with no saved adapter defaults to pi while no OpenAI endpoint
            is saved.
        agent:
          $ref: '#/components/schemas/AgentSettings'
          description: The saved agent settings, or their defaults while none are
            saved.
        workflow_labels:
          type: object
          description: 'Display label by workflow type, such as requirements_review:
            Requirements review.'
        providers:
          type: object
          description: 'By adapter: label, models (id, label, thinking_levels and
            context_window: the context window in tokens, null when the provider does
            not report it), error and hint. The openai adapter is listed only while
            an OpenAI endpoint base URL is saved, with the endpoint''s display name
            as its label when one is set.'
        openai_endpoint:
          $ref: '#/components/schemas/OpenAIEndpointView'
          description: 'The OpenAI endpoint: base URL, display name and api_key_set
            for the administrator; only the display name for any other user.'
      required:
      - workflows
      - agent
      - workflow_labels
      - providers
      - openai_endpoint
    OpenAIEndpointView:
      type: object
      description: The shared OpenAI endpoint as GET /settings shows it, shaped by
        the caller's role. Never contains the API key.
      properties:
        base_url:
          type: string
          format: uri
          description: 'Administrator only: the saved base URL; null when no endpoint
            is saved. Absent for any other user.'
        display_name:
          type: string
          description: The saved display name, shown as the openai provider label
            in the model pickers; null when none is saved (the client then shows OpenAI).
            Returned to every signed-in user.
        api_key_set:
          type: boolean
          description: 'Administrator only: whether an API key is stored. Absent for
            any other user.'
    OpenAIEndpointInput:
      type: object
      description: The OpenAI endpoint to save. When the base URL or API key changes,
        the service first sends GET {base_url}/models with the key, waiting at most
        10 seconds; if it does not answer successfully, the whole PUT answers 422
        and nothing is saved.
      properties:
        base_url:
          type: string
          format: uri
          description: 'Base URL of the OpenAI-compatible endpoint: an http or https
            URL of at most 2048 characters; anything else answers 422 before any check
            is sent.'
        api_key:
          type: string
          description: The new API key, stored encrypted and never returned. Omitted
            or null keeps the stored key, which is allowed only while base_url stays
            the same (422 otherwise); an empty string saves the endpoint without a
            key.
        display_name:
          type: string
          description: Optional label shown instead of OpenAI in the model pickers;
            trimmed, at most 100 characters (422 otherwise). Empty, null or omitted
            saves no display name (null), and the pickers then show OpenAI. Changing
            only the display name saves without a check.
      required:
      - base_url
    SettingsUpdate:
      type: object
      description: 'The body of PUT /settings: the model settings of every LLM workflow
        type and, optionally, the agent settings and the OpenAI endpoint. Everything
        is saved in one transaction.'
      properties:
        workflows:
          type: object
          description: 'ModelSettings by workflow type; must hold exactly every type:
            chat, requirements, requirements_review, api_design, implementation, test_generation,
            diagnosis, documentation, review and routing; 422 otherwise.'
        openai_endpoint:
          $ref: '#/components/schemas/OpenAIEndpointInput'
          description: Administrator only (403 for anyone else whenever the key is
            present, including null). Absent leaves the endpoint unchanged; an object
            saves it; null removes it (base URL, API key and display name), which
            answers 409 naming the workflow types whose saved adapter is openai and
            clears nothing, and is a successful no-op when no endpoint is saved.
        agent:
          $ref: '#/components/schemas/AgentSettings'
          description: Absent leaves the saved agent settings unchanged; an object
            replaces them.
      required:
      - workflows
    OpenAIEndpointRemovalConflict:
      type: object
      description: The 409 body of PUT /settings when removing the OpenAI endpoint
        is blocked because workflow types still use the openai adapter. Nothing is
        cleared.
      properties:
        detail:
          type: string
          description: Says the endpoint cannot be removed and names the workflow
            types whose saved adapter is openai; the Settings page shows it.
        workflow_types:
          type: array
          items:
            type: string
          description: The workflow types whose saved adapter is openai, such as chat
            or requirements_review, in the order of the workflows keys.
      required:
      - detail
      - workflow_types
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
