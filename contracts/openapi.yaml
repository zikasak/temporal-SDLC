security:
- bearer: []
components:
  schemas:
    Credentials:
      type: object
      description: A login and a password.
      properties:
        login:
          type: string
          description: An email address or a username, case-insensitive.
        password:
          type: string
      required:
      - login
      - password
    Session:
      type: object
      description: A signed-in session.
      properties:
        access_token:
          type: string
          description: Bearer token, also set as the access_token cookie.
        token_type:
          type: string
          enum:
          - bearer
        login:
          type: string
        expires_at:
          type: string
          format: date-time
        admin:
          type: boolean
          description: Whether the user is the first user.
      required:
      - access_token
      - token_type
      - login
      - expires_at
      - admin
    Profile:
      type: object
      description: The signed-in user.
      properties:
        login:
          type: string
        expires_at:
          type: string
          format: date-time
        admin:
          type: boolean
      required:
      - login
      - expires_at
      - admin
    RegistrationStatus:
      type: object
      description: Whether the first account can still be registered.
      properties:
        open:
          type: boolean
      required:
      - open
    Account:
      type: object
      description: A user account.
      properties:
        login:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - login
      - created_at
    GitHubAppCredentials:
      type: object
      description: A GitHub App to connect.
      properties:
        app_id:
          type: integer
        private_key:
          type: string
          description: The app's private key in PEM format.
        account:
          type: string
          description: The account the app is installed on, when it is installed on
            several.
      required:
      - app_id
      - private_key
    ManifestCode:
      type: object
      description: The code GitHub returned after creating an app from a manifest.
      properties:
        code:
          type: string
      required:
      - code
    EmptyObject:
      type: object
      description: An empty JSON object.
      properties: {}
    GitHubApp:
      type: object
      description: A GitHub App.
      properties:
        id:
          type: integer
        slug:
          type: string
      required:
      - id
      - slug
    GitHubInstallation:
      type: object
      description: Where the GitHub App is installed.
      properties:
        id:
          type: integer
        account:
          type: string
      required:
      - id
      - account
    GitHubConnection:
      type: object
      description: The shared GitHub connection; never its private key.
      properties:
        configured:
          type: boolean
        encryption_ready:
          type: boolean
        app:
          $ref: '#/components/schemas/GitHubApp'
          description: Null when not configured.
        installation:
          $ref: '#/components/schemas/GitHubInstallation'
          description: Null until the app is installed.
        validated_at:
          type: string
          format: date-time
      required:
      - configured
      - encryption_ready
    Repository:
      type: object
      description: A repository the GitHub App can access.
      properties:
        repository_id:
          type: integer
        full_name:
          type: string
        html_url:
          type: string
        private:
          type: boolean
        default_branch:
          type: string
      required:
      - repository_id
      - full_name
      - html_url
      - private
      - default_branch
    RepositoryPage:
      type: object
      description: A page of repositories.
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
        next_page:
          type: integer
          description: Null on the last page.
      required:
      - repositories
    BranchPage:
      type: object
      description: A page of branch names.
      properties:
        branches:
          type: array
          items:
            type: string
        next_page:
          type: integer
          description: Null on the last page.
      required:
      - branches
    RepositoryInput:
      type: object
      description: A repository and branch to work in.
      properties:
        full_name:
          type: string
          description: owner/name
        branch:
          type: string
      required:
      - full_name
      - branch
    RepositorySelection:
      type: object
      description: The repository a session works in.
      properties:
        provider:
          type: string
          enum:
          - github
        repository_id:
          type: integer
        full_name:
          type: string
        html_url:
          type: string
        private:
          type: boolean
        branch:
          type: string
      required:
      - provider
      - repository_id
      - full_name
      - html_url
      - private
      - branch
    Question:
      type: object
      description: A question asked of the user, with options to choose from.
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: string
      required:
      - question
      - options
    Message:
      type: object
      description: A message of a conversation.
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        attachment:
          type: object
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
          description: Asked by an assistant message; the next user message answers
            them.
      required:
      - role
      - content
    TaskKindOption:
      type: object
      description: A kind of task.
      properties:
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        label:
          type: string
      required:
      - kind
      - label
    Intake:
      type: object
      description: The questions every requirements session starts with.
      properties:
        kind_question:
          type: string
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/TaskKindOption'
        questions:
          type: object
          description: The questions of each kind, by kind, as Question lists.
        task_question:
          type: string
      required:
      - kind_question
      - kinds
      - questions
      - task_question
    CreateRequirementsSession:
      type: object
      description: The intake of a new requirements session.
      properties:
        repository:
          $ref: '#/components/schemas/RepositoryInput'
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        answers:
          type: array
          items:
            type: string
          description: One answer per question of the kind, in order.
        task:
          type: string
          description: What needs to be done; at most 10000 characters.
      required:
      - repository
      - kind
      - answers
      - task
    SessionCreated:
      type: object
      description: A session that was started.
      properties:
        session_id:
          type: string
      required:
      - session_id
    MessageInput:
      type: object
      description: A user message.
      properties:
        message:
          type: string
          description: 1 to 10000 characters after trimming.
      required:
      - message
    AnswersInput:
      type: object
      description: Answers to the questions of the last assistant message.
      properties:
        answers:
          type: array
          items:
            type: string
          description: One per question, in order.
      required:
      - answers
    AgentAnswersInput:
      type: object
      description: Answers to the questions of a paused delivery agent.
      properties:
        workflow_id:
          type: string
          description: The stage workflow of the agent that asked.
        answers:
          type: array
          items:
            type: string
      required:
      - workflow_id
      - answers
    RetryStageInput:
      type: object
      description: The delivery stage to retry.
      properties:
        stage:
          type: string
          enum:
          - server
          - tests
          - documentation
          - repository
      required:
      - stage
    ForkInput:
      type: object
      description: Where a fork starts.
      properties:
        message_index:
          type: integer
          description: The last message the fork keeps.
      required:
      - message_index
    SessionStatusChange:
      type: object
      description: A session after an accepted request.
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - preparing
          - interviewing
          - turn_running
          - finalizing
          - completed
          - failed
        verification_status:
          type: string
      required:
      - session_id
    Requirement:
      type: object
      description: A requirement of the task.
      properties:
        id:
          type: string
        category:
          type: string
          enum:
          - functional
          - non_functional
          - technical
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum:
          - must
          - should
          - could
        rationale:
          type: string
      required:
      - id
      - category
      - title
      - description
      - priority
    RequirementsSession:
      type: object
      description: A requirements session and its delivery.
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - preparing
          - interviewing
          - turn_running
          - finalizing
          - completed
          - failed
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        retired:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: Requirements of the repository's contract the change ends.
        document:
          type: object
          description: The requirements document, once written.
        error:
          type: string
        forked_from:
          type: object
        repository:
          $ref: '#/components/schemas/RepositorySelection'
        checkout:
          type: object
        contract_commit:
          type: string
        delivery:
          type: object
          description: Progress of the delivery of a bugfix or documentation task.
      required:
      - session_id
      - status
      - messages
      - requirements
      - retired
    StartApiDesignSession:
      type: object
      description: The requirements session an API design continues.
      properties:
        requirements_session_id:
          type: string
      required:
      - requirements_session_id
    ApiDesignSession:
      type: object
      description: An API design session and its delivery.
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - preparing
          - interviewing
          - turn_running
          - finalizing
          - completed
          - failed
        source_session_id:
          type: string
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        api:
          type: object
          description: The designed endpoints and schemas.
        language:
          type: string
          description: The implementation language, once chosen.
        document:
          type: object
          description: The OpenAPI document, once rendered.
        error:
          type: string
        forked_from:
          type: object
        repository:
          $ref: '#/components/schemas/RepositorySelection'
        checkout:
          type: object
        problems:
          type: array
          items:
            type: string
          description: What must be settled before the design can be finalized.
        verification_status:
          type: string
        publication_status:
          type: string
        verification:
          type: object
        publication:
          type: object
          description: The branch the delivery pushed.
        agent_questions:
          type: array
          items:
            type: object
          description: Questions of paused delivery agents. The other delivery progress
            fields (code, implementation, tests, repairs and their errors) are returned
            alongside.
      required:
      - session_id
      - status
      - source_session_id
      - messages
      - requirements
      - api
      - problems
      - verification_status
      - publication_status
    LLMRequestInput:
      type: object
      description: A chat request. Also accepted as multipart form data with one file.
      properties:
        message:
          type: string
        parent_request_id:
          type: string
        fork_after:
          type: integer
        repository:
          $ref: '#/components/schemas/RepositoryInput'
      required:
      - message
    LLMRequestStarted:
      type: object
      description: A chat request that is running.
      properties:
        request_id:
          type: string
        status:
          type: string
          enum:
          - running
      required:
      - request_id
      - status
    LLMRequest:
      type: object
      description: A chat request and its conversation.
      properties:
        request_id:
          type: string
        status:
          type: string
        result:
          type: string
        error:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        parent_request_id:
          type: string
        generated_documents:
          type: array
          items:
            type: object
        repository:
          $ref: '#/components/schemas/RepositorySelection'
      required:
      - request_id
      - status
      - messages
      - generated_documents
    WorkflowExecution:
      type: object
      description: A workflow execution.
      properties:
        workflow_id:
          type: string
        run_id:
          type: string
        workflow_type:
          type: string
        status:
          type: string
        task_queue:
          type: string
        parent_workflow_id:
          type: string
        start_time:
          type: string
          format: date-time
        close_time:
          type: string
          format: date-time
      required:
      - workflow_id
      - run_id
      - workflow_type
      - status
      - task_queue
      - start_time
    WorkflowPage:
      type: object
      description: A page of workflow executions.
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowExecution'
        next_page_token:
          type: string
      required:
      - workflows
    WorkflowResult:
      type: object
      description: The result of the sample workflow.
      properties:
        result:
          type: string
      required:
      - result
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
