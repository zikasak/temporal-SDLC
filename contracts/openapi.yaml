  /workflows:
    get:
      operationId: getWorkflows
      summary: List workflow executions
      description: 'Newest first, 50 per page. type TaskWorkflow lists only task flows
        (the top-level flow of each task or onboarding), not RequirementsWorkflow
        or OnboardingWorkflow executions, which are reached by opening their task
        flow; type RequirementsWorkflow lists requirements sessions, OnboardingWorkflow
        onboarding interviews (workflow_id is the onboarding''s session_id), RequirementsReviewWorkflow
        requirements reviews and ArchitectureWorkflow architecture sessions. Every
        execution also carries repository, branch, name, origin, linked, waiting_for_user
        and unresolved_findings, each null when it does not apply; the onboarding_id
        field and filter are removed. The existing fields keep their names and meaning,
        and status additionally takes the values pending and skipped for stages of
        a task flow. The optional repository, branch and origin filters combine with
        type and with each other (all must match); executions whose field is null
        never match a filter on it, so origin lists only task flows. The repository
        filter is compared case-insensitively, as on GitHub; the branch filter must
        match exactly. A malformed filter value (a repository that is not owner/name,
        an empty branch, or an origin other than requirements or onboarding) answers
        422 with a detail, like an invalid type or page_token. Pass the same filters
        with page_token when continuing. top_level=true lists only executions without
        a parent: task flows, chats, and the requirements and onboarding flows started
        before onboardings ran under task flows; no stage of a task (requirements
        or onboarding interview, requirements review, architecture, API design or
        delivery, including a delivery started again on its own) is ever top-level.
        parent=<workflow_id> lists only the direct children of that execution: for
        a task flow, its requirements (or, for an onboarding''s task flow, its onboarding
        interview), requirements review, architecture, API design and delivery children
        (including a delivery started again on its own) and, for a forked or fix-round
        task flow, the original task''s earlier stages it links to, with linked true;
        parent=<a stage''s workflow_id> never lists another stage of the task (a requirements,
        onboarding interview, review or API design session lists none, a delivery
        its code generation and stage workflows). For a requirements or onboarding
        flow started before this change, parent lists its children as before. parent
        and top_level cannot be combined; an empty or malformed parent, or parent
        with top_level, answers 422.'
      tags:
      - workflows
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: A workflow type to list only, such as TaskWorkflow or RequirementsReviewWorkflow.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
        description: next_page_token of the last page.
      - name: repository
        in: query
        required: false
        schema:
          type: string
        description: Only executions working in this repository, as owner/name (its
          full_name), compared case-insensitively; 422 when not of the form owner/name.
      - name: branch
        in: query
        required: false
        schema:
          type: string
        description: Only executions working on this source branch, compared exactly;
          422 when empty.
      - name: origin
        in: query
        required: false
        schema:
          type: string
        description: 'Only task flows of this origin: requirements (started by a requirements
          interview) or onboarding (started by an onboarding); 422 for any other value.'
      - name: parent
        in: query
        required: false
        schema:
          type: string
        description: Only the direct children of this workflow execution and, for
          a forked or fix-round task flow, the earlier stages it links to (linked
          true); 422 when empty or malformed, or combined with top_level.
      - name: top_level
        in: query
        required: false
        schema:
          type: boolean
        description: 'true lists only executions without a parent workflow: task flows,
          chats, and the requirements and onboarding flows started before onboardings
          ran under task flows; a stage of a task is never listed.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
