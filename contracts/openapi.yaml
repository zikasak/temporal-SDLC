  /requirements/sessions/{session_id}/messages:
    post:
      operationId: postRequirementsSessionsBySessionIdMessages
      summary: Send a message
      description: 'Starts the interviewer''s turn on the message. Also allowed while
        the review''s contradiction questions are open (review.status contradictions_found)
        or after a failed review round (review.status failed). A message sent while
        contradiction questions are open drops them: review.questions_open becomes
        false, review.status stays contradictions_found with the last round''s contradictions
        still listed, the questions are no longer answerable through POST .../answers,
        and the message may change the requirements. Finalizing again starts the next
        round, given those changes in the diff and the dropped questions marked unanswered.
        A message sent after a failed round may change the requirements too; review.status
        stays failed with its error, finalizing again starts a new round on the updated
        requirements, and POST .../review/retry still reruns the failed round with
        its original input. The web client warns the user before sending such a message.
        409 while a review round is running (review.status running); finalize with
        force=true stays possible.'
      tags:
      - requirements
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        description: requirements-session- followed by 32 hex digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusChange'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
