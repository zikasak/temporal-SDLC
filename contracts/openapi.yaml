        a webhook secret (created before mentions were supported), it also turns on
        the app''s webhook pointing at POST /connectors/github/events with a newly
        generated secret, stored encrypted, through GitHub''s app webhook configuration.
        GitHub''s API cannot change an app''s event subscriptions or permissions,
        so for every connection, manifest-created or manual, the check reads the app''s
        subscribed events and the installation''s permissions and sets webhook_events_missing
        when issue_comment or pull_request_review_comment is missing or pull_requests:
        write is not granted; the app''s owner must then fix this in GitHub''s app
        settings and check again. A manually connected app keeps its webhook settings;
        its secret changes only by connecting again.'
