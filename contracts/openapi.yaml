      - FR-179
      - FR-183
      - FR-184
      - NFR-8
    put:
      operationId: putSettings
      summary: Save the model settings
      description: 'Replaces the settings of every LLM workflow type; the body must
        include requirements_review too (422 otherwise). 422 when a selected model
        or thinking level is no longer offered, including openai while no endpoint
        is saved. 422 when a compaction_tokens of a workflow type that is not claude
        exceeds the context window its provider reports for the selected model. The
        optional agent section replaces the agent settings; without it they stay unchanged.
        The optional openai_endpoint section is administrator only: 403 for any other
        user whose body contains it (also when null), while a body without it saves
        their workflow settings and leaves the endpoint unchanged. openai_endpoint.base_url
        must be an http or https URL of at most 2048 characters and display_name at
        most 100 characters after trimming (422 otherwise). Saving the endpoint with
        a changed base URL or API key first sends GET {base URL}/models with the new
        key, or the stored one when api_key is omitted or null, waiting at most 10
        seconds; when it does not answer successfully, 422 with a detail giving the
        HTTP status it answered or the connection error (never the key); 422 also
        when the base URL changed and no new key was given. A change of the display
        name alone saves without a check. An empty api_key saves the endpoint without
        a key. openai_endpoint null removes the endpoint; while any workflow type''s
        saved adapter is openai it answers 409 with an OpenAIEndpointRemovalConflict
        body (a detail naming those workflow types plus their workflow_types list)
        and clears nothing; it succeeds without change when no endpoint is saved.
        The endpoint and the workflow settings are saved in one transaction: any error
        saves nothing. 503 when a provider''s models cannot be listed or SETTINGS_ENCRYPTION_KEY
        is missing. The response has the same shape as GET /settings (SettingsView,
        with its openai_endpoint section shaped by the caller''s role), never the
        API key; its workflows field holds the saved workflow settings as before.'
      tags:
      - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: OK
