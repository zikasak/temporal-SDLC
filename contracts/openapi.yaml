      summary: Finalize the onboarding
      description: 'For an onboarding that produces the full contract, first starts
        the task flow''s pending requirements review child (review.status running),
        which checks the drafted requirements against each other and, when the onboarding
        replaces an existing contract, against that contract''s requirements; each
        contradiction found is asked in the interview as a question, and after the
        answers the review runs again knowing what changed, without a limit on rounds.
        After a free message dropped the open contradiction questions (review.status
        contradictions_found with questions_open false), calling it again starts the
        next round, given the diff of the drafted requirements since the previous
        round and the dropped questions marked unanswered. After a failed round (review.status
        failed), calling it starts a new round on the current drafts, including any
        changes made by messages since the failure, given the diff since the last
        finished round; POST .../review/retry instead reruns the failed round with
        its original input. Only once a round finds no contradictions, or with force=true,
        are the reviewed drafts fixed as the contract, including contracts/architecture.md,
        and handed to the task flow, which starts its pending delivery child: contract
        tests and a root Dockerfile are written and verified against the existing
        code, then code review, push to a new branch named onboarding/<source branch>-<short
        id> (the short id taken from the onboarding''s session ID) and a pull request
        to the default branch, as for a delivery. Without force=true, calling it while
        a round is running or while the contradiction questions are open (questions_open
        true) answers 409. For an architecture-only onboarding no review runs (its
        review child closes as skipped), and only contracts/architecture.md (and contracts/architecture.json)
        is pushed to that branch with a pull request to the default branch, without
        contract tests, verification or code review; the rest of the existing contract
        is left unchanged, and disagreements between the drafted architecture and
        the existing api.json or requirements.json are among the problems that block
        finalizing. 409 while problems remain or a turn is running.'
