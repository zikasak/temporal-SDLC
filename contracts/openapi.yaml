security:
- bearer: []
components:
  schemas:
    Credentials:
      type: object
      description: A login and a password.
      properties:
        login:
          type: string
          description: An email address or a username, case-insensitive.
        password:
          type: string
      required:
      - login
      - password
    Session:
      type: object
      description: A signed-in session.
      properties:
        access_token:
          type: string
          description: Bearer token, also set as the access_token cookie.
        token_type:
          type: string
          enum:
          - bearer
        login:
          type: string
        expires_at:
          type: string
          format: date-time
        admin:
          type: boolean
          description: Whether the user is the first user.
      required:
      - access_token
      - token_type
      - login
      - expires_at
      - admin
    Profile:
      type: object
      description: The signed-in user.
      properties:
        login:
          type: string
        expires_at:
          type: string
          format: date-time
        admin:
          type: boolean
      required:
      - login
      - expires_at
      - admin
    RegistrationStatus:
      type: object
      description: Whether the first account can still be registered.
      properties:
        open:
          type: boolean
      required:
      - open
    Account:
      type: object
      description: A user account.
      properties:
        login:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - login
      - created_at
    GitHubAppCredentials:
      type: object
      description: A GitHub App to connect.
      properties:
        app_id:
          type: integer
        private_key:
          type: string
          description: The app's private key in PEM format.
        account:
          type: string
          description: The account the app is installed on, when it is installed on
            several.
        webhook_secret:
          type: string
          description: The app's webhook secret, stored encrypted and never returned.
            Without it, webhook deliveries are rejected and mentions are not handled.
      required:
      - app_id
      - private_key
    ManifestCode:
      type: object
      description: The code GitHub returned after creating an app from a manifest.
      properties:
        code:
          type: string
      required:
      - code
    EmptyObject:
      type: object
      description: An empty JSON object.
      properties: {}
    GitHubApp:
      type: object
      description: A GitHub App.
      properties:
        id:
          type: integer
        slug:
          type: string
      required:
      - id
      - slug
    GitHubInstallation:
      type: object
      description: Where the GitHub App is installed.
      properties:
        id:
          type: integer
        account:
          type: string
      required:
      - id
      - account
    GitHubConnection:
      type: object
      description: The shared GitHub connection; never its private key or webhook
        secret.
      properties:
        configured:
          type: boolean
        encryption_ready:
          type: boolean
        app:
          $ref: '#/components/schemas/GitHubApp'
          description: Null when not configured.
        installation:
          $ref: '#/components/schemas/GitHubInstallation'
          description: Null until the app is installed.
        validated_at:
          type: string
          format: date-time
        webhook_secret_set:
          type: boolean
          description: Whether the connection has a webhook secret; false when not
            configured. Mentions are handled only while it is true.
        webhook_events_missing:
          type: boolean
          description: 'True when the last connect or check found the app not subscribed
            to issue_comment or pull_request_review_comment events, or its installation
            without the pull_requests: write permission, which its owner must add
            in GitHub''s app settings because GitHub''s API cannot; mentions in comments
            of a missing event type do not arrive, and without the permission the
            app cannot reply. Filled in for every connection, manifest-created or
            manual, by connecting or checking the connection; false when not configured
            or until checked.'
      required:
      - configured
      - encryption_ready
      - webhook_secret_set
      - webhook_events_missing
    Repository:
      type: object
      description: A repository the GitHub App can access.
      properties:
        repository_id:
          type: integer
        full_name:
          type: string
        html_url:
          type: string
        private:
          type: boolean
        default_branch:
          type: string
      required:
      - repository_id
      - full_name
      - html_url
      - private
      - default_branch
    RepositoryPage:
      type: object
      description: A page of repositories.
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
        next_page:
          type: integer
          description: Null on the last page.
      required:
      - repositories
    BranchPage:
      type: object
      description: A page of branch names.
      properties:
        branches:
          type: array
          items:
            type: string
        next_page:
          type: integer
          description: Null on the last page.
      required:
      - branches
    RepositoryInput:
      type: object
      description: A repository and branch to work in.
      properties:
        full_name:
          type: string
          description: owner/name
        branch:
          type: string
      required:
      - full_name
      - branch
    RepositorySelection:
      type: object
      description: The repository a session works in.
      properties:
        provider:
          type: string
          enum:
          - github
        repository_id:
          type: integer
        full_name:
          type: string
        html_url:
          type: string
        private:
          type: boolean
        branch:
          type: string
      required:
      - provider
      - repository_id
      - full_name
      - html_url
      - private
      - branch
    Question:
      type: object
      description: A question asked of the user, with options to choose from.
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: string
      required:
      - question
      - options
    Message:
      type: object
      description: A message of a conversation.
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        attachment:
          type: object
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
          description: Asked by an assistant message; the next user message answers
            them.
      required:
      - role
      - content
    TaskKindOption:
      type: object
      description: A kind of task.
      properties:
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        label:
          type: string
      required:
      - kind
      - label
    Intake:
      type: object
      description: The questions every requirements session starts with.
      properties:
        kind_question:
          type: string
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/TaskKindOption'
        questions:
          type: object
          description: The questions of each kind, by kind, as Question lists.
        task_question:
          type: string
      required:
      - kind_question
      - kinds
      - questions
      - task_question
    CreateRequirementsSession:
      type: object
      description: The intake of a new requirements session.
      properties:
        repository:
          $ref: '#/components/schemas/RepositoryInput'
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        answers:
          type: array
          items:
            type: string
          description: One answer per question of the kind, in order.
        task:
          type: string
          description: What needs to be done; at most 10000 characters.
      required:
      - repository
      - kind
      - answers
      - task
    SessionCreated:
      type: object
      description: A session that was started.
      properties:
        session_id:
          type: string
      required:
      - session_id
    MessageInput:
      type: object
      description: A user message.
      properties:
        message:
          type: string
          description: 1 to 10000 characters after trimming.
      required:
      - message
    AnswersInput:
      type: object
      description: Answers to the questions of the last assistant message.
      properties:
        answers:
          type: array
          items:
            type: string
          description: One per question, in order.
      required:
      - answers
    AgentAnswersInput:
      type: object
      description: Answers to the questions of a paused delivery agent.
      properties:
        workflow_id:
          type: string
          description: The stage workflow of the agent that asked.
        answers:
          type: array
          items:
            type: string
      required:
      - workflow_id
      - answers
    RetryStageInput:
      type: object
      description: The delivery stage to retry.
      properties:
        stage:
          type: string
          enum:
          - server
          - tests
          - documentation
          - repository
          - review
          description: review runs a failed code review again on the verified delivery.
            repository pushes the delivery again and then opens or updates its pull
            request, such as after pull_request_status became error; it also has the
            LLM write the pull request's title and description again, such as after
            pull_request_text_error was set.
      required:
      - stage
    ForkInput:
      type: object
      description: Where a fork starts.
      properties:
        message_index:
          type: integer
          description: The last message the fork keeps.
      required:
      - message_index
    SessionStatusChange:
      type: object
      description: A session after an accepted request.
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - preparing
          - awaiting_confirmation
          - declined
          - drafting
          - interviewing
          - turn_running
          - finalizing
          - completed
          - skipped
          - failed
          - superseded
          description: awaiting_confirmation, declined and superseded occur only for
            onboardings; drafting for onboardings and architecture sessions; skipped
            only for architecture sessions.
        verification_status:
          type: string
          description: As in ApiDesignSession, including reviewing and findings_open.
      required:
      - session_id
    Requirement:
      type: object
      description: A requirement of the task.
      properties:
        id:
          type: string
        category:
          type: string
          enum:
          - functional
          - non_functional
          - technical
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum:
          - must
          - should
          - could
        rationale:
          type: string
      required:
      - id
      - category
      - title
      - description
      - priority
    RequirementsSession:
      type: object
      description: A requirements session and its delivery.
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - preparing
          - interviewing
          - turn_running
          - finalizing
          - completed
          - failed
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        retired:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: Requirements of the repository's contract the change ends.
        lookup_requirements:
          type: array
          items:
            $ref: '#/components/schemas/LookupRequirement'
          description: 'Every requirement a requirement ID mentioned in the conversation
            or in the delivery''s agent questions can refer to: those recorded in
            the session, the existing service''s and those the task retires (retired
            true). Empty when there are none.'
        document:
          type: object
          description: The requirements document, once written.
        error:
          type: string
        forked_from:
          type: object
        repository:
          $ref: '#/components/schemas/RepositorySelection'
        checkout:
          type: object
        contract_commit:
          type: string
        architecture_session_id:
          type: string
          description: 'The architecture session the session started by itself once
            the user generated the document of a new service or an API change; it
            drafts the architecture at once, as a child of the session, and later
            starts the API design. Null until then, for any other kind of task, for
            a session without a repository, and for one whose document was written
            because it expired. Replaces api_design_session_id, which is no longer
            returned: the API design is found through the architecture session.'
        delivery:
          type: object
          description: Progress of the delivery of a bugfix or documentation task.
            A bugfix's progress also holds reviews (ReviewRound list), review_error,
            the open_findings flag, findings_acceptance (FindingsAcceptance), the
            reviewing and findings_open verification_status values and the publication
            (RepositoryPublication) with its verified flag, the first 20 open findings
            its commit message lists and findings_count, as in ApiDesignSession. Every
            delivery's progress also holds pull_request_status and, once a pushed
            delivery's pull request is open, pull_request (PullRequest), pull_request_error,
            pull_request_text_error, and mentions (PullRequestMention list) of the
            app on that pull request, as in ApiDesignSession.
      required:
      - session_id
      - status
      - messages
      - requirements
      - retired
      - lookup_requirements
    ApiDesignSession:
      type: object
      description: An API design session and its delivery.
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - preparing
          - interviewing
          - turn_running
          - finalizing
          - completed
          - failed
        source_session_id:
          type: string
        architecture_session_id:
          type: string
          description: The architecture session that started this design when it was
            finalized or skipped; the design remains a child of the requirements session
            (source_session_id).
        architecture:
          type: string
          description: 'The architecture the design and the delivery''s coding agents
            are given, as Markdown: the finalized architecture, or the repository''s
            existing contracts/architecture.md when an API change skipped the stage.
            It is committed as contracts/architecture.md when the delivery is pushed
            (unchanged when skipped).'
        architecture_structure:
          $ref: '#/components/schemas/ArchitectureStructure'
          description: The same architecture in machine-readable form, committed as
            contracts/architecture.json when the delivery is pushed (unchanged when
            skipped).
        kind:
          type: string
          enum:
          - new_service
          - api_change
          - bugfix
          - docs
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        lookup_requirements:
          type: array
          items:
            $ref: '#/components/schemas/LookupRequirement'
          description: 'Every requirement a requirement ID mentioned in the conversation
            or in the delivery''s agent questions can refer to: those recorded in
            the task''s requirements session, the existing service''s and those the
            task retires (retired true). Empty when there are none.'
        api:
          type: object
          description: The designed endpoints and schemas.
        language:
          type: string
          description: The implementation language, once chosen.
        document:
          type: object
          description: The OpenAPI document, once rendered.
        error:
          type: string
        forked_from:
          type: object
        repository:
          $ref: '#/components/schemas/RepositorySelection'
        checkout:
          type: object
        problems:
          type: array
          items:
            type: string
          description: What must be settled before the design can be finalized.
        verification_status:
          type: string
          enum:
          - not_applicable
          - waiting
          - running
          - diagnosing
          - repairing
          - reviewing
          - completed
          - findings_open
          - skipped
          - error
          description: reviewing while the code review runs; findings_open when the
            tests pass but review findings remained after the last review round; error
            also when verification fails for good in a round started by the user's
            instructions, or when the code review failed (see review_error).
        publication_status:
          type: string
        verification:
          type: object
        publication:
          $ref: '#/components/schemas/RepositoryPublication'
          description: The branch the delivery pushed, with the commit and the open
            review findings its message lists. Its verified flag is false for documentation
            without a check and for code pushed with open review findings.
        agent_questions:
          type: array
          items:
            type: object
          description: Questions of paused delivery agents. The other delivery progress
            fields (code, implementation, tests, repairs and their errors) are returned
            alongside.
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewRound'
          description: Every code review round of the delivery, oldest first, with
            each finding's worker and the reason for it and, for rounds the user started,
            their instructions.
        review_error:
          type: string
          description: Why the last code review failed to run, such as an LLM error;
            the review stage can then be retried. Cleared when a review completes.
        open_findings:
          type: boolean
          description: Raised when findings remained after the last review round and
            the delivery was pushed as unverified; the user accepts it or gives instructions.
            It stays raised when verification fails for good in a round started by
            instructions, and the branch keeps the earlier unverified push.
        findings_acceptance:
          $ref: '#/components/schemas/FindingsAcceptance'
          description: Set when the user accepted the delivery with its open review
            findings as it is.
        pull_request_status:
          type: string
          enum:
          - not_applicable
          - waiting
          - running
          - completed
          - skipped
          - error
          description: 'The pull request step after the push, with the same values
            as publication_status: waiting until the branch is pushed, running while
            the pull request is opened or updated, completed once it is open or updated,
            skipped when nothing was pushed, error when it could not be opened or
            updated (see pull_request_error). An error never fails the push or the
            delivery; retrying the repository stage pushes again and retries the pull
            request. Falling back to the generic title and description is not an error:
            the step still completes (see pull_request_text_error).'
        pull_request:
          $ref: '#/components/schemas/PullRequest'
          description: The pull request opened from the pushed branch to the default
            branch, once it is open. A later push to the same branch keeps an open
            pull request and rewrites both its title and its description, and marks
            a draft ready for review when that push is verified. If the earlier pull
            request was closed or merged, the later push opens a new one and this
            field links to it. When updating it fails, this field keeps the existing
            pull request.
        pull_request_error:
          type: string
          description: 'Why the pull request could not be opened or updated, such
            as the GitHub App installation lacking the pull_requests: write permission,
            or a network or GitHub API error. Reported the same way whether opening
            or updating failed. The push and the delivery do not fail because of it;
            retrying the repository stage tries again. Cleared when the pull request
            step completes.'
        pull_request_text_error:
          type: string
          description: 'Why the LLM could not write the pull request''s title and
            description at the last open or update, such as the LLM being unavailable,
            so the generic text was used instead: today''s generic title for the task
            kind (with the " (unverified)" marker for an unverified delivery) and
            a generic description made of today''s fixed sentence of what the delivery
            changed, followed only by the open review findings when there are any.
            The push, the pull request step and the delivery do not fail because of
            it. While it is set, the repository stage can be retried: it pushes again
            and has the LLM write the title and description again. Cleared when a
            later open or update uses LLM-written text.'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/PullRequestMention'
          description: Every authorised mention of the GitHub App on the delivery's
            pull request, oldest first, with its classification and the fix round
            or reply it led to. Fix rounds a mention starts are recorded in reviews
            like rounds started by instructions, with the comment's text as their
            instructions.
      required:
      - session_id
      - status
      - source_session_id
      - messages
      - requirements
      - lookup_requirements
      - api
      - problems
      - verification_status
      - publication_status
      - pull_request_status
    LLMRequestInput:
      type: object
      description: A chat request. Also accepted as multipart form data with one file.
      properties:
        message:
          type: string
        parent_request_id:
          type: string
        fork_after:
          type: integer
        repository:
          $ref: '#/components/schemas/RepositoryInput'
      required:
      - message
    LLMRequestStarted:
      type: object
      description: A chat request that is running.
      properties:
        request_id:
          type: string
        status:
          type: string
          enum:
          - running
      required:
      - request_id
      - status
    LLMRequest:
      type: object
      description: A chat request and its conversation.
      properties:
        request_id:
          type: string
        status:
          type: string
        result:
          type: string
        error:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        parent_request_id:
          type: string
        generated_documents:
          type: array
          items:
            type: object
        repository:
          $ref: '#/components/schemas/RepositorySelection'
      required:
      - request_id
      - status
      - messages
      - generated_documents
    WorkflowExecution:
      type: object
      description: A workflow execution.
      properties:
        workflow_id:
          type: string
        run_id:
          type: string
        workflow_type:
          type: string
        status:
          type: string
        task_queue:
          type: string
        parent_workflow_id:
          type: string
        start_time:
          type: string
          format: date-time
        close_time:
          type: string
          format: date-time
        repository:
          $ref: '#/components/schemas/RepositorySelection'
          description: Always present. The repository the execution works in, as in
            the session's repository (provider, repository_id, full_name, html_url,
            private and the source branch), for OnboardingWorkflow, RequirementsWorkflow,
            ArchitectureWorkflow, ApiDesignWorkflow and DeliveryWorkflow executions,
            and for CodegenWorkflow executions the repository of the delivery that
            started them; null for any other execution.
        branch:
          type: string
          description: Always present. The branch the execution works in (the source
            branch the session checked out, not a branch the delivery pushes; the
            same as repository.branch), for OnboardingWorkflow, RequirementsWorkflow,
            ArchitectureWorkflow, ApiDesignWorkflow and DeliveryWorkflow executions,
            and for CodegenWorkflow executions the branch of the delivery that started
            them; null for any other execution.
        onboarding_id:
          type: string
          description: 'Always present. The session_id of the onboarding the execution
            was started for: the OnboardingWorkflow''s own workflow_id, or the onboarding
            that started a DeliveryWorkflow or CodegenWorkflow execution; null for
            an execution not started for an onboarding.'
      required:
      - workflow_id
      - run_id
      - workflow_type
      - status
      - task_queue
      - start_time
    WorkflowPage:
      type: object
      description: A page of workflow executions.
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowExecution'
        next_page_token:
          type: string
      required:
      - workflows
    ReviewFinding:
      type: object
      description: A problem the code review found in the delivery's own changes.
      properties:
        summary:
          type: string
          description: What is wrong and why it needs a correction.
        path:
          type: string
          description: The changed file the finding is about, when it is about one.
        target:
          type: string
          enum:
          - implementation
          - tests
          - both
          description: The worker the finding was sent to.
        reason:
          type: string
          description: Briefly, why the finding was sent to that worker.
        unresolved:
          type: string
          description: On a finding left open that no author of the delivery could settle,
            why: failing repository tests that no author may change assert otherwise, or
            the review still found it after its corrections.
      required:
      - summary
      - target
      - reason
    ReviewRound:
      type: object
      description: One code review round of a delivery.
      properties:
        round:
          type: integer
          description: Numbered from 1 across the whole delivery. Each run of review
            rounds, including the run started by the user's instructions, is limited
            to 5 apart from test repair rounds, so numbers above 5 come from instructed
            runs.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ReviewFinding'
          description: Empty when the review found nothing worth correcting.
        instructions:
          type: string
          description: The user's instructions about open review findings that the
            fixes reviewed in this round were made from; absent for rounds the user
            did not start.
      required:
      - round
      - findings
    FindingsInstructionsInput:
      type: object
      description: What the user wants done about the open review findings.
      properties:
        instructions:
          type: string
          description: 1 to 10000 characters after trimming.
      required:
      - instructions
    FindingsAcceptance:
      type: object
      description: The user's acceptance of a delivery pushed with open review findings.
      properties:
        accepted_at:
          type: string
          format: date-time
        accepted_by:
          type: string
          description: Login of the user who accepted the delivery as it is.
      required:
      - accepted_at
      - accepted_by
    RepositoryPublication:
      type: object
      description: The branch a delivery was pushed to.
      properties:
        branch:
          type: string
        commit:
          type: string
          description: SHA of the pushed commit.
        url:
          type: string
        verified:
          type: boolean
          description: False for documentation without a check and for code pushed
            with open review findings; the commit message says so too.
        ignored:
          type: array
          items:
            type: string
          description: Verified paths left out because the repository's .gitignore
            matches them (first few).
        ignored_count:
          type: integer
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ReviewFinding'
          description: The first 20 open review findings, as the pushed commit's message
            lists them; empty or absent when the commit was pushed without open findings.
        findings_count:
          type: integer
          description: The number of all open review findings at the push, including
            those beyond the first 20; the commit message states it too. 0 or absent
            without open findings.
      required:
      - branch
      - commit
      - url
      - verified
      - ignored
      - ignored_count
    PullRequest:
      type: object
      description: The pull request opened from a delivery's pushed branch to the
        repository's default branch.
      properties:
        number:
          type: integer
          description: The pull request's number in the repository.
        title:
          type: string
          description: The pull request's title on GitHub, at most 200 characters.
            Written by an LLM from the task, its requirements and the delivery's code
            diff, naming the specific change, and written again on every later push
            that updates the pull request; for an unverified delivery followed by
            the " (unverified)" marker. When the LLM cannot write it, today's generic
            title for the task kind is used instead, with the same marker (see pull_request_text_error).
        url:
          type: string
          format: uri
          description: Link to the pull request on GitHub.
        draft:
          type: boolean
          description: 'True while the last push to its branch was an unverified delivery:
            documentation without a check or code pushed with open review findings.
            A later verified push to the same branch marks the pull request ready
            for review, and draft becomes false.'
        base:
          type: string
          description: The default branch the pull request targets.
      required:
      - number
      - title
      - url
      - draft
      - base
    PullRequestMention:
      type: object
      description: An authorised mention of the GitHub App on the delivery's pull
        request and what it led to.
      properties:
        comment_id:
          type: integer
          description: GitHub's ID of the comment.
        comment_type:
          type: string
          enum:
          - conversation
          - review
          description: A pull request conversation comment or an inline review comment.
        url:
          type: string
          format: uri
          description: Link to the comment on GitHub.
        author:
          type: string
          description: GitHub login of the comment's author.
        body:
          type: string
          description: The comment's text.
        received_at:
          type: string
          format: date-time
        classification:
          type: string
          enum:
          - pending
          - fix
          - clarification
          - unclear
          description: pending until the LLM has classified the mention.
        status:
          type: string
          enum:
          - classifying
          - queued
          - running
          - replied
          - completed
          - error
          description: queued while a fix request waits for the running fix round;
            running while its round runs; replied once a clarification or an unclear
            mention was answered; completed once a fix round's result was pushed;
            error when classifying, replying or the fix round failed (see error).
        round:
          type: integer
          description: The first review round of the fix round the mention started,
            as numbered in reviews.
        reply_url:
          type: string
          format: uri
          description: Link to the app's last reply to the mention in the pull request.
        error:
          type: string
          description: What failed, as also replied in the pull request.
      required:
      - comment_id
      - comment_type
      - url
      - author
      - body
      - received_at
      - classification
      - status
    GitHubWebhookEvent:
      type: object
      description: A GitHub webhook payload, as GitHub sends it; only the fields used
        are listed and any others are allowed.
      properties:
        action:
          type: string
          description: Such as created.
        comment:
          type: object
          description: The conversation or inline review comment, with its id, body,
            html_url and user.
        issue:
          type: object
          description: 'For issue_comment: the pull request as an issue, with number
            and pull_request.'
        pull_request:
          type: object
          description: 'For pull_request_review_comment: the pull request.'
        repository:
          type: object
        installation:
          type: object
        sender:
          type: object
    CreateOnboardingSession:
      type: object
      description: The repository and branch to onboard.
      properties:
        repository:
          $ref: '#/components/schemas/RepositoryInput'
      required:
      - repository
    OnboardingSession:
      type: object
      description: 'An onboarding of an existing repository: the drafted contract,
        the review interview and the delivery of the contract, contract tests and
        Dockerfile, or of contracts/architecture.md alone. Every signed-in user can
        reopen any onboarding.'
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - preparing
          - awaiting_confirmation
          - declined
          - drafting
          - interviewing
          - turn_running
          - finalizing
          - completed
          - failed
          - superseded
          description: awaiting_confirmation while the branch has a contract in contracts/,
            contract tests or a root Dockerfile and the user has not yet decided,
            at the start or again after a checkout update found ones not there before;
            declined once the user chose decline, which ends the onboarding without
            changing anything; drafting while the LLM drafts the requirements, the
            architecture, the API and the language from the existing code (only the
            architecture for an architecture-only onboarding); preparing also while
            the checkout is updated; superseded once the onboarding was forked, which
            ends it so that only the fork stays unfinished.
        repository:
          $ref: '#/components/schemas/RepositorySelection'
        checkout:
          type: object
          description: The commit the onboarding is checked out at; changes when the
            checkout is updated.
        forked_from:
          type: object
          description: The onboarding and message this one was forked from.
        existing_contract:
          type: boolean
          description: Whether the branch had a contract in contracts/, contract tests
            in contract-tests/ or a root Dockerfile at the start or the last checkout
            update; true exactly when existing_artifacts is not empty.
        existing_artifacts:
          type: array
          items:
            type: string
            enum:
            - contract
            - contract_tests
            - dockerfile
          description: What the branch had at the start, refreshed by each checkout
            update, and the onboarding would replace; empty when it had none of them.
        architecture_missing:
          type: boolean
          description: True when the branch has a contract in contracts/ but lacks
            contracts/architecture.md or contracts/architecture.json (both are required),
            at the start or the last checkout update; only then is the architecture_only
            decision offered.
        replaced_contract:
          type: boolean
          description: Whether the user chose to replace what existing_artifacts lists
            (decision replace).
        architecture_only:
          type: boolean
          description: 'Whether the user chose to add only contracts/architecture.md
            (decision architecture_only): only the architecture is drafted and reviewed,
            requirements, api and language stay empty, and the result is pushed with
            a pull request without contract tests, verification or code review.'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: The drafted requirements, as corrected in the interview; empty
            for an architecture-only onboarding.
        lookup_requirements:
          type: array
          items:
            $ref: '#/components/schemas/LookupRequirement'
          description: 'Every requirement a requirement ID mentioned in the conversation
            or in the delivery''s agent questions can refer to: the drafted requirements
            and the existing contract''s requirements, with retired false. Empty when
            there are none.'
        architecture:
          type: string
          description: The architecture drafted by the LLM from the existing code,
            as Markdown with the fixed headings (Components with their responsibilities,
            Data flow, Technology choices), rendered from architecture_structure as
            corrected in the interview; written to contracts/architecture.md. Null
            until drafted.
        architecture_structure:
          $ref: '#/components/schemas/ArchitectureStructure'
          description: The same architecture in machine-readable form; written to
            contracts/architecture.json. Null until drafted.
        api:
          type: object
          description: The drafted endpoints and schemas, as corrected in the interview;
            empty for an architecture-only onboarding.
        language:
          type: string
          description: The implementation language of the existing code, as the LLM
            detected it from the code and the user may correct it in the interview;
            written to contracts/language.json. Null for an architecture-only onboarding.
        problems:
          type: array
          items:
            type: string
          description: What must be settled before the onboarding can be finalized.
        error:
          type: string
        delivery:
          type: object
          description: 'Progress of verifying and publishing the contract, contract
            tests and Dockerfile, with the same fields as an ApiDesignSession''s delivery
            progress: verification_status, publication_status, verification, publication
            (its branch named onboarding/<source branch>-<short id>), agent_questions
            (including a coding agent''s question whether a failing test reveals a
            bug in the existing code, which waits for an answer without a timeout),
            reviews, review_error, open_findings, findings_acceptance, pull_request_status,
            pull_request, pull_request_error, pull_request_text_error and mentions.
            When the existing code was changed after the user confirmed a bug, the
            result is still verified as usual once the tests pass, and the pushed
            commit''s message and the pull request''s description say that the existing
            code was changed. For an architecture-only onboarding, verification_status
            is not_applicable, reviews stay empty and open_findings is never raised;
            only the publication of contracts/architecture.md and contracts/architecture.json
            and its pull request are reported.'
      required:
      - session_id
      - status
      - repository
      - existing_contract
      - existing_artifacts
      - architecture_missing
      - replaced_contract
      - architecture_only
      - messages
      - requirements
      - lookup_requirements
      - api
      - problems
    ContractDecisionInput:
      type: object
      description: The user's choice about the contract, contract tests or root Dockerfile
        the branch already has.
      properties:
        decision:
          type: string
          enum:
          - replace
          - decline
          - architecture_only
          description: replace replaces everything listed in existing_artifacts and
            the onboarding proceeds to drafting the full contract; decline ends the
            onboarding as declined and leaves the existing files unchanged; architecture_only,
            allowed only while architecture_missing is true, drafts only contracts/architecture.md
            from the existing code and leaves every other file of the existing contract,
            the contract tests and the Dockerfile unchanged. Replaces the former replace_contract
            boolean.
      required:
      - decision
    SkipProposal:
      type: object
      description: The LLM's proposal, made instead of the initial draft, to skip
        the architecture stage of an API change, waiting for the user.
      properties:
        reason:
          type: string
          description: Why the LLM judges that the task needs no new architecture.
        message_index:
          type: integer
          description: The assistant message that made the proposal.
      required:
      - reason
      - message_index
    ArchitectureSession:
      type: object
      description: 'An architecture session: the LLM''s draft of the task''s top-level
        architecture and the review conversation.'
      properties:
        session_id:
          type: string
          description: architecture-session- followed by 32 hex digits.
        status:
          type: string
          enum:
          - preparing
          - drafting
          - interviewing
          - turn_running
          - finalizing
          - completed
          - skipped
          - failed
          description: drafting while the LLM drafts the architecture from the requirements
            (for an API change starting from the repository's contracts/architecture.md),
            or decides instead to propose skipping the stage; skipped once the user
            skipped the stage.
        source_session_id:
          type: string
          description: The requirements session that started this architecture session.
        kind:
          type: string
          enum:
          - new_service
          - api_change
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        lookup_requirements:
          type: array
          items:
            $ref: '#/components/schemas/LookupRequirement'
          description: 'Every requirement a requirement ID mentioned in the conversation
            can refer to: those recorded in the task''s requirements session, the
            existing service''s and those the task retires (retired true). Empty when
            there are none.'
        architecture:
          type: string
          description: 'The current draft as Markdown, rendered from structure with
            fixed headings: Components (with their responsibilities), Data flow and
            Technology choices. Null until drafted, including while a skip proposal
            made instead of the initial draft is open.'
        structure:
          $ref: '#/components/schemas/ArchitectureStructure'
          description: The current draft in machine-readable form, written to contracts/architecture.json
            when the delivery is pushed. Null until drafted.
        skip_proposal:
          $ref: '#/components/schemas/SkipProposal'
          description: The LLM's open proposal to skip the stage. Only for an API
            change and only made instead of the initial draft; null when none is open.
            Once declined (by sending a message) it is dismissed, the architecture
            is drafted and no skip is proposed again in the session.
        skip_declined:
          type: boolean
          description: True once the user declined the skip proposal; the LLM proposes
            no further skip in this session.
        document:
          type: object
          description: The architecture document (contracts/architecture.md and contracts/architecture.json),
            once finalized.
        error:
          type: string
        forked_from:
          type: object
        repository:
          $ref: '#/components/schemas/RepositorySelection'
        checkout:
          type: object
        problems:
          type: array
          items:
            type: string
          description: What must be settled before the architecture can be finalized.
        api_design_session_id:
          type: string
          description: The API design this session started when it was finalized or
            skipped, as a child of the requirements session; null until then.
      required:
      - session_id
      - status
      - source_session_id
      - kind
      - messages
      - requirements
      - lookup_requirements
      - skip_declined
      - problems
    ArchitectureComponent:
      type: object
      description: A component or module of the architecture.
      properties:
        name:
          type: string
        responsibilities:
          type: array
          items:
            type: string
          description: What the component is responsible for.
      required:
      - name
      - responsibilities
    ArchitectureDataFlow:
      type: object
      description: Data passed from one component to another.
      properties:
        source:
          type: string
          description: Name of the component the data comes from.
        target:
          type: string
          description: Name of the component the data goes to.
        description:
          type: string
          description: What data flows and how.
      required:
      - source
      - target
      - description
    ArchitectureTechnologyChoice:
      type: object
      description: A key technology choice.
      properties:
        topic:
          type: string
          description: What the choice is about, such as storage or messaging.
        choice:
          type: string
        rationale:
          type: string
      required:
      - topic
      - choice
    ArchitectureStructure:
      type: object
      description: The machine-readable architecture, written to contracts/architecture.json;
        contracts/architecture.md is rendered from it with fixed headings (Components,
        Data flow, Technology choices).
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/ArchitectureComponent'
        data_flows:
          type: array
          items:
            $ref: '#/components/schemas/ArchitectureDataFlow'
        technology_choices:
          type: array
          items:
            $ref: '#/components/schemas/ArchitectureTechnologyChoice'
      required:
      - components
      - data_flows
      - technology_choices
    LookupRequirement:
      type: object
      description: 'A requirement a requirement ID mentioned in the conversation can
        refer to, for the web client to show on hover or tap. The list holds one entry
        per ID and every requirement that applies, without a size limit: when the
        session records a requirement with the same ID as one of the existing service,
        the session''s version is listed, and an ID the task retires is listed with
        retired true. For a session without an existing service (a new service, or
        an onboarding of a branch without a contract), it holds only the requirements
        recorded or drafted in the session.'
      properties:
        id:
          type: string
          description: 'The requirement''s ID in canonical form: upper-case prefix,
            a dash and the number (PREFIX-NUMBER), such as FR-12, whatever form it
            was recorded in. The client matches fr12, FR12 or fr-12 to it by upper-casing
            and inserting the dash.'
        category:
          type: string
          enum:
          - functional
          - non_functional
          - technical
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum:
          - must
          - should
          - could
        retired:
          type: boolean
          description: True when the task retires this requirement of the existing
            service.
      required:
      - id
      - category
      - title
      - description
      - priority
      - retired
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
