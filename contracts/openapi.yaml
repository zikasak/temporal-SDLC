  /settings:
    get:
      operationId: getSettings
      summary: Get the model settings
      description: 'The adapter, model, thinking level and compaction threshold of
        every LLM workflow type, including the requirements_review entry used by the
        requirements reviewer of tasks and onboardings, the agent settings, with labels
        and the selectable models of each provider and their context windows where
        reported, and the openai_endpoint section shaped by role: base URL, display
        name and whether an API key is set for the administrator, only the display
        name for anyone else. The openai adapter is offered in providers only while
        an endpoint base URL is saved. 503 when a saved key cannot be read without
        a valid SETTINGS_ENCRYPTION_KEY.'
      tags:
      - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        '401':
